components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/v1/admin/auth/login` or `/refresh` (HS256, `typ=access`, 2 hours).

  parameters:
    ContractId:
      name: id
      in: path
      required: true
      description: Contract id.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: |
        `BAD_REQUEST` — body validation failed (`errors[]` lists each field), or the request is malformed
        (unparsable JSON, wrong type of a path/query parameter such as a non-UUID id).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validation:
              value:
                success: false
                code: BAD_REQUEST
                message: Dữ liệu không hợp lệ
                errors:
                  - { field: name, message: must not be blank }
            malformed:
              value:
                success: false
                code: BAD_REQUEST
                message: Yêu cầu không hợp lệ
    Unauthorized:
      description: '`UNAUTHORIZED` — missing, invalid or expired access token (or a refresh token used as access token).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: UNAUTHORIZED
            message: Phiên đăng nhập không hợp lệ hoặc đã hết hạn
    Forbidden:
      description: '`FORBIDDEN` — the caller''s role may not perform this operation (admin-only route called by `ROLE_STAFF`), or `PASSWORD_CHANGE_REQUIRED` while the account still has a temporary password.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: FORBIDDEN
            message: Bạn không có quyền thực hiện thao tác này
    NotFound:
      description: '`NOT_FOUND` — a referenced record does not exist. Message: `Không tìm thấy <tài nguyên> (<id>)`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: NOT_FOUND
            message: Không tìm thấy hợp đồng (6b7c8d9e-0f1a-4b2c-9d3e-5f6a7b8c9d0e)

  schemas:
    # ------------------------------------------------------------ envelope
    ApiSuccess:
      type: object
      description: Success envelope (`ApiResponse` with `success = true`). `data` is omitted when the operation has no payload.
      required: [success, code, message]
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          const: SUCCESS
        message:
          type: string
          description: Vietnamese user-facing message.
          examples: [Thao tác thành công]
        data:
          description: Operation payload.
    ApiError:
      type: object
      description: Error envelope (`ApiResponse` with `success = false`). `errors` only on field validation failures.
      required: [success, code, message]
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
          description: Error code from spec §1.3.
          examples: [BAD_REQUEST]
        message:
          type: string
          description: Vietnamese user-facing message.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Request field (or parameter) name.
        message:
          type: string

    # ------------------------------------------------------------ shared types
    Uuid:
      type: string
      format: uuid
    LocalDate:
      type: string
      format: date
      examples: ['2026-10-03']
    Money:
      type: integer
      format: int64
      description: Amount in VND (integer, no decimals).
      examples: [25000000]
    VnPhone:
      type: string
      pattern: '^0(3|5|7|8|9)[0-9]{8}$'
      description: Vietnamese mobile number (spec §1.1).
      examples: ['0900000001']

    # ------------------------------------------------------------ enums
    Role:
      type: string
      description: Console roles (a login is only possible with these two).
      enum: [ROLE_ADMIN, ROLE_STAFF]
    BookingStatus:
      type: string
      description: '`UPCOMING` = waiting for confirmation ("Chờ xác nhận").'
      enum: [UPCOMING, IN_PROGRESS, CONFIRMED, COMPLETED, CANCELLED]
    AssetCategory:
      type: string
      enum: [DRESS, SUIT, CAMERA_EQUIPMENT]
    AssetStatus:
      type: string
      enum: [AVAILABLE, IN_USE, MAINTENANCE]
    StaffWorkStatus:
      type: string
      enum: [WORKING, ON_LEAVE]
    LeadStage:
      type: string
      enum: [NEW_LEAD, IN_CONSULTATION, AWAITING_DEPOSIT, IN_PROGRESS, COMPLETED]
    ContractStatus:
      type: string
      description: '`COMPLETED` = paid in full AND delivered; paid in full alone is `remainingAmount = 0`.'
      enum: [DRAFT, DEPOSITED, IN_PROGRESS, COMPLETED]
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE]

    # ------------------------------------------------------------ auth
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 6
          maxLength: 100
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 100
          pattern: '^(?=.*\p{L})(?=.*\d).*$'
    AuthUserDto:
      type: object
      required: [id, name, email, role, mustChangePassword]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          description: Full name.
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        mustChangePassword:
          type: boolean
          description: |
            Temporary password (FN-ADM-USER-01). Until it is changed, every route except `auth/me`,
            `auth/change-password`, `auth/logout` and `auth/logout-all` answers `403 PASSWORD_CHANGE_REQUIRED`.
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
          description: JWT, 2 hours, `typ=access`.
        refreshToken:
          type: string
          description: JWT, 30 days, `typ=refresh`.
        user:
          $ref: '#/components/schemas/AuthUserDto'

    # ------------------------------------------------------------ zalo sharing / public contract
    ShareZaloRequest:
      type: object
      properties:
        phoneNumber:
          type: [string, 'null']
          description: Defaults to the contract's phone; required when the contract has `hasZalo = false`.
          pattern: '^$|^0(3|5|7|8|9)[0-9]{8}$'
    ShareResultDto:
      type: object
      required: [sentTo, publicUrl, shareExpiresAt]
      properties:
        sentTo:
          type: string
          examples: ['0901***222']
        publicUrl:
          type: string
          format: uri
          examples: ['https://admin.example.vn/c/3q2-ZpM1n0cT9rjqK0x8sQZ6y2f4kz3xv8c1m5Jtq4E']
        shareExpiresAt:
          type: string
          format: date-time
    ZaloOaSettingsDto:
      type: object
      required: [hasAppSecret, hasRefreshToken, configured]
      properties:
        appId:
          type: [string, 'null']
        templateId:
          type: [string, 'null']
        hasAppSecret:
          type: boolean
        hasRefreshToken:
          type: boolean
        configured:
          type: boolean
          description: App ID, secret, refresh token and template are all set.
        accessTokenExpiresAt:
          type: [string, 'null']
          format: date-time
    UpdateZaloOaRequest:
      type: object
      required: [appId, templateId]
      properties:
        appId:
          type: string
          minLength: 1
          maxLength: 50
        appSecret:
          type: [string, 'null']
          maxLength: 255
        refreshToken:
          type: [string, 'null']
          maxLength: 2000
        templateId:
          type: string
          minLength: 1
          maxLength: 50
    PublicContractDto:
      type: object
      required: [contractNumber, studio, customerName, phone, packageName, features, totalAmount, paidAmount, remainingAmount, installments, status]
      properties:
        contractNumber:
          type: string
        studio:
          type: object
          required: [name, address, bankInfo]
          properties:
            name:
              type: string
            address:
              type: string
            bankInfo:
              type: string
        customerName:
          type: string
        phone:
          type: string
          description: Masked.
          examples: ['0901***222']
        packageName:
          type: string
        features:
          type: array
          items:
            type: string
        totalAmount:
          type: integer
        paidAmount:
          type: integer
        remainingAmount:
          type: integer
        installments:
          type: array
          items:
            type: object
            required: [label, percent, amount]
            properties:
              label:
                type: string
              percent:
                type: integer
              amount:
                type: integer
        eventDate:
          type: [string, 'null']
          format: date
        status:
          type: string
          enum: [DRAFT, DEPOSITED, IN_PROGRESS, COMPLETED]
        acceptedAt:
          type: [string, 'null']
          format: date-time

    # ------------------------------------------------------------ users
    UserAccountDto:
      type: object
      required: [id, email, name, role, isActive]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        staffId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        staffName:
          type: [string, 'null']
        isActive:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time
    CreatedAccountDto:
      type: object
      required: [user, temporaryPassword]
      properties:
        user:
          $ref: '#/components/schemas/UserAccountDto'
        temporaryPassword:
          type: string
          minLength: 12
          maxLength: 12
          description: Shown only in this response; the account must change it at first login.
    CreateUserRequest:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [ROLE_ADMIN, ROLE_STAFF]
        staffId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    UpdateUserRequest:
      type: object
      description: Every field is sent; `staffId = null` unlinks the staff profile.
      required: [name, role, isActive]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [ROLE_ADMIN, ROLE_STAFF]
        isActive:
          type: boolean
        staffId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    UserAccountPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserAccountDto'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # ------------------------------------------------------------ dashboard
    MoneyMetric:
      type: object
      required: [amount, formatted, trendPercentage, isIncrease]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        formatted:
          type: string
          description: VND display string, e.g. `245.000.000đ`.
        trendPercentage:
          type: number
          format: double
        isIncrease:
          type: boolean
    CountMetric:
      type: object
      required: [value, trendPercentage, isIncrease]
      properties:
        value:
          type: integer
          format: int64
          minimum: 0
        trendPercentage:
          type: number
          format: double
        isIncrease:
          type: boolean
    RateMetric:
      type: object
      required: [percentage, trendPercentage, isIncrease]
      properties:
        percentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
        trendPercentage:
          type: number
          format: double
          description: Percentage-point difference with the same day last month.
        isIncrease:
          type: boolean
    StatsDto:
      type: object
      required: [monthlyRevenue, activeContractsCount, pendingLeadsCount, costumeRentalRate]
      properties:
        monthlyRevenue:
          $ref: '#/components/schemas/MoneyMetric'
        activeContractsCount:
          $ref: '#/components/schemas/CountMetric'
        pendingLeadsCount:
          $ref: '#/components/schemas/CountMetric'
        costumeRentalRate:
          $ref: '#/components/schemas/RateMetric'
    RevenuePoint:
      type: object
      required: [month, amount]
      properties:
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        amount:
          $ref: '#/components/schemas/Money'

    # ------------------------------------------------------------ bookings
    StaffRefDto:
      type: object
      required: [id, name, role]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        role:
          type: string
          description: The staff member's position (job title), not a security role.
    BookingDto:
      type: object
      required: [id, date, time, clientName, phone, type, packageName, venueAddress, status, assignedStaff, contractId]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        date:
          $ref: '#/components/schemas/LocalDate'
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Event time `HH:mm` (24h).
        clientName:
          type: string
        phone:
          type: [string, 'null']
        type:
          type: string
          description: Appointment type, e.g. "Chụp Pre-wedding".
        packageName:
          type: string
          description: Name of the service package, or `—` when none.
        venueAddress:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/BookingStatus'
        assignedStaff:
          type: array
          description: Sorted by staff code.
          items:
            $ref: '#/components/schemas/StaffRefDto'
        contractId:
          type: [string, 'null']
          format: uuid
          description: The contract this session belongs to; null for consultations before signing.
    CreateBookingRequest:
      type: object
      required: [clientName, type, eventDate, eventTime]
      properties:
        clientName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: [string, 'null']
          pattern: '^$|^0(3|5|7|8|9)[0-9]{8}$'
          description: Empty or a Vietnamese mobile number.
        servicePackageId:
          type: [string, 'null']
          format: uuid
        type:
          type: string
          minLength: 1
          maxLength: 100
        eventDate:
          type: string
          format: date
          description: Not before today.
        eventTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: '`HH:mm` (24h).'
        venueAddress:
          type: [string, 'null']
          maxLength: 255
        staffIds:
          type: [array, 'null']
          items:
            type: string
            format: uuid
        contractId:
          type: [string, 'null']
          format: uuid
          description: Contract the booking belongs to; its phone and package fill the blanks.
        leadId:
          type: [string, 'null']
          format: uuid
          description: Customer (CRM lead) the booking is for; with a `contractId` it must be the contract's customer.

    # ------------------------------------------------------------ packages
    PackageDto:
      type: object
      required: [id, name, type, price, features, isActive]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        type:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean
    CreatePackageRequest:
      type: object
      required: [name, type, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          minLength: 1
          maxLength: 100
        price:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: VND.
        features:
          type: [array, 'null']
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 255
    SetActiveRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    # ------------------------------------------------------------ assets
    AssetDto:
      type: object
      required: [id, code, name, category, size, status, nextBookingDate, maintenanceBufferDays]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          examples: [VAY-001]
        name:
          type: string
        category:
          $ref: '#/components/schemas/AssetCategory'
        size:
          type: [string, 'null']
          description: '`N/A` when not applicable (column is nullable for legacy rows).'
        status:
          $ref: '#/components/schemas/AssetStatus'
        nextBookingDate:
          type: [string, 'null']
          format: date
        maintenanceBufferDays:
          type: integer
          format: int32
          minimum: 0
    AssetConflictDto:
      type: object
      required: [assetCode, assetName, date, message]
      properties:
        assetCode:
          type: string
        assetName:
          type: string
        date:
          $ref: '#/components/schemas/LocalDate'
        message:
          type: string
    ReservationDto:
      type: object
      required: [id, assetCode, startDate, endDate, lockEndDate]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        assetCode:
          type: string
        startDate:
          $ref: '#/components/schemas/LocalDate'
        endDate:
          $ref: '#/components/schemas/LocalDate'
        lockEndDate:
          type: string
          format: date
          description: '`endDate + maintenanceBufferDays`.'
    CreateAssetRequest:
      type: object
      required: [code, name, category]
      properties:
        code:
          type: string
          minLength: 1
          pattern: '^[A-Za-z]{2,5}-\d{3,}$'
          description: Stored upper-case, e.g. `VAY-001`.
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/AssetCategory'
        size:
          type: [string, 'null']
          maxLength: 20
          description: Blank or missing → `N/A`.
        maintenanceBufferDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 30
          default: 0
    ReserveRequest:
      type: object
      required: [assetId, rentalStartDate, rentalEndDate]
      properties:
        assetId:
          type: string
          minLength: 1
          description: Asset UUID or asset code (e.g. `VAY-001`).
        rentalStartDate:
          type: string
          format: date
        rentalEndDate:
          type: string
          format: date
          description: Must be ≥ `rentalStartDate`.
        bookingId:
          type: [string, 'null']
          format: uuid

    # ------------------------------------------------------------ staff
    StaffDto:
      type: object
      required: [id, code, name, position, phone, workStatus, completedThisMonth]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          examples: [NV-001]
        name:
          type: string
        position:
          type: string
        phone:
          type: string
        workStatus:
          $ref: '#/components/schemas/StaffWorkStatus'
        completedThisMonth:
          type: integer
          format: int64
          minimum: 0
    TaskDto:
      type: object
      required: [id, staffId, title, dueDate, notes, completed]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        staffId:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        dueDate:
          $ref: '#/components/schemas/LocalDate'
        notes:
          type: [string, 'null']
        completed:
          type: boolean
    CreateStaffRequest:
      type: object
      required: [name, phone, position]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          $ref: '#/components/schemas/VnPhone'
        position:
          type: string
          minLength: 1
          maxLength: 100
    CreateTaskRequest:
      type: object
      required: [title, dueDate]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        dueDate:
          type: string
          format: date
        notes:
          type: [string, 'null']
          maxLength: 1000
    UpdateTaskRequest:
      type: object
      required: [completed]
      properties:
        completed:
          type: boolean

    # ------------------------------------------------------------ crm
    LeadDto:
      type: object
      required: [id, name, phone, hasZalo, interest, stage, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        phone:
          type: string
        hasZalo:
          type: boolean
        interest:
          type: [string, 'null']
        stage:
          $ref: '#/components/schemas/LeadStage'
        createdAt:
          type: string
          format: date
          description: Creation date (Asia/Ho_Chi_Minh), date only.
    CreateLeadRequest:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          $ref: '#/components/schemas/VnPhone'
        hasZalo:
          type: [boolean, 'null']
          description: Null/missing → false.
        interest:
          type: [string, 'null']
          maxLength: 200
    UpdateStageRequest:
      type: object
      required: [stage]
      properties:
        stage:
          $ref: '#/components/schemas/LeadStage'

    # ------------------------------------------------------------ contracts
    ContractDto:
      type: object
      required: [id, contractNumber, customerName, phone, hasZalo, packageName, totalAmount, paidAmount, remainingAmount, contractDate, status, notes, deliveredAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        contractNumber:
          type: string
          examples: [HD-102]
        customerName:
          type: string
        phone:
          type: string
        hasZalo:
          type: boolean
        packageName:
          type: string
          description: Package name captured when the contract was created.
        totalAmount:
          $ref: '#/components/schemas/Money'
        paidAmount:
          $ref: '#/components/schemas/Money'
        remainingAmount:
          $ref: '#/components/schemas/Money'
        contractDate:
          $ref: '#/components/schemas/LocalDate'
        status:
          $ref: '#/components/schemas/ContractStatus'
        notes:
          type: [string, 'null']
        deliveredAt:
          type: [string, 'null']
          format: date-time
          description: When the hand-over was confirmed; set with `remainingAmount > 0` = delivered but still owing.
    CreateContractRequest:
      type: object
      required: [customerName, phone, servicePackageId, totalAmount, depositAmount]
      properties:
        customerName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          $ref: '#/components/schemas/VnPhone'
        servicePackageId:
          type: string
          format: uuid
        totalAmount:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: VND.
        depositAmount:
          type: integer
          format: int64
          minimum: 0
          description: VND, must not exceed `totalAmount`.
        hasZalo:
          type: [boolean, 'null']
          description: Null → taken from the matching CRM lead (true when there is none).
        notes:
          type: [string, 'null']
          maxLength: 1000
    # ------------------------------------------------------------ financials
    TransactionDto:
      type: object
      required: [id, code, transactionDate, description, type, amount, category, contractId]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          examples: [TRX-001]
        transactionDate:
          $ref: '#/components/schemas/LocalDate'
        description:
          type: string
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/Money'
        category:
          type: string
        contractId:
          type: [string, 'null']
          format: uuid
    SummaryDto:
      type: object
      required: [periodLabel, totalIncome, totalExpense, netProfit]
      properties:
        periodLabel:
          type: string
          examples: [Tháng 10]
        totalIncome:
          $ref: '#/components/schemas/Money'
        totalExpense:
          $ref: '#/components/schemas/Money'
        netProfit:
          type: integer
          format: int64
          description: VND, `totalIncome − totalExpense` (may be negative).
    CreateTransactionRequest:
      type: object
      required: [type, amount, category, description, transactionDate]
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: VND.
        category:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 255
        contractId:
          type: [string, 'null']
          format: uuid
        transactionDate:
          type: string
          format: date
          description: Not after today.

    # ------------------------------------------------------------ notifications / search / settings
    NotificationDto:
      type: object
      required: [id, title, description, createdAt, read]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
    SearchResult:
      type: object
      required: [id, label, kind]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
        kind:
          type: string
          enum: [contract, lead]
    StudioSettingsDto:
      type: object
      required: [name, address, taxCode, legalRepresentative, bankInfo]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 255
        taxCode:
          type: string
          minLength: 1
          maxLength: 20
        legalRepresentative:
          type: string
          minLength: 1
          maxLength: 100
        bankInfo:
          type: string
          minLength: 1
          maxLength: 500
        zaloPhone:
          type: [string, 'null']
          pattern: '^$|^0(3|5|7|8|9)[0-9]{8}$'
          description: >-
            v1.1.3 (FN-ADM-SET-01): Zalo number couples open from the WedPlanner app catalog (FN-SVC-02). Empty or null
            = no Zalo link; an invalid number → `400 BAD_REQUEST` on `zaloPhone`.
