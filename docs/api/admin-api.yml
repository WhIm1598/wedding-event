  # ---------------------------------------------------------------- assets
  /api/v1/admin/assets:
    get:
      tags: [assets]
      operationId: listAssets
      summary: List wardrobe & equipment
      description: |
        Sorted by `code`. `status` is derived for today: inside `[start, end]` of a confirmed rental → `IN_USE`;
        inside `(end, lockEnd]` → `MAINTENANCE`; otherwise the manually set status. `nextBookingDate` = earliest
        rental start ≥ today among active reservations, or null.
      x-spec-function: FN-ADM-ASSET-02
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      parameters:
        - name: category
          in: query
          required: false
          description: Filter by category (exact constant; anything else → `400 BAD_REQUEST`).
          schema:
            $ref: '#/components/schemas/AssetCategory'
      responses:
        '200':
          description: Assets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssetDto'
              example:
                success: true
                code: SUCCESS
                message: Thao tác thành công
                data:
                  - id: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                    code: VAY-001
                    name: Vera Wang đuôi cá đính đá
                    category: DRESS
                    size: M
                    status: AVAILABLE
                    nextBookingDate: '2026-10-14'
                    maintenanceBufferDays: 3
                  - id: 6a7b8c9d-0e1f-4a2b-9c3d-5e6f7a8b9c0d
                    code: VST-002
                    name: Vest đen Hàn Quốc
                    category: SUIT
                    size: 42R
                    status: IN_USE
                    nextBookingDate: null
                    maintenanceBufferDays: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [assets]
      operationId: createAsset
      summary: Add a dress, suit or equipment item
      description: |
        `code` is stored upper-case and must be unique (case-insensitive, `409 ASSET_CODE_EXISTS`). A blank or
        missing `size` is stored as `"N/A"`. A missing `maintenanceBufferDays` means 0. New items are `AVAILABLE`.
      x-spec-function: FN-ADM-ASSET-02
      x-roles: [ROLE_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
            example:
              code: VAY-005
              name: Váy cưới ren Pháp tay dài
              category: DRESS
              size: S
              maintenanceBufferDays: 3
      responses:
        '201':
          description: Asset created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AssetDto'
              example:
                success: true
                code: SUCCESS
                message: Đã thêm sản phẩm
                data:
                  id: 7b8c9d0e-1f2a-4b3c-8d4e-6f7a8b9c0d1e
                  code: VAY-005
                  name: Váy cưới ren Pháp tay dài
                  category: DRESS
                  size: S
                  status: AVAILABLE
                  nextBookingDate: null
                  maintenanceBufferDays: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`ASSET_CODE_EXISTS` — the code is already used.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: ASSET_CODE_EXISTS
                message: Mã sản phẩm VAY-005 đã tồn tại

  /api/v1/admin/assets/conflicts:
    get:
      tags: [assets]
      operationId: listAssetConflicts
      summary: Overlapping rentals of the same item
      description: |
        For each item, consecutive active (`CONFIRMED`, `lockEndDate >= today`) reservations whose lock windows
        overlap (next start ≤ previous lock end) — legacy/imported data — for the red warning banner. `date` is the
        start date of the later reservation.
      x-spec-function: FN-ADM-ASSET-02
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      responses:
        '200':
          description: Conflicts (empty when none).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssetConflictDto'
              example:
                success: true
                code: SUCCESS
                message: Thao tác thành công
                data:
                  - assetCode: VAY-001
                    assetName: Vera Wang đuôi cá đính đá
                    date: '2026-10-17'
                    message: 'Sản phẩm "VAY-001 (Vera Wang đuôi cá đính đá)" đang được xếp cho 2 lịch thuê chồng lấn: 14/10/2026 và 17/10/2026 (bảo dưỡng đến 18/10/2026). Vui lòng kiểm tra lại lịch.'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/assets/booking:
    post:
      tags: [assets]
      operationId: reserveAsset
      summary: Reserve an item for a rental period (maintenance-buffer lock)
      description: |
        `assetId` accepts the UUID or the asset code (e.g. `VAY-001`, case-insensitive). The asset row is locked
        (`SELECT … FOR UPDATE`) so concurrent requests are serialized. Lock window =
        `[rentalStartDate, rentalEndDate + maintenanceBufferDays]`; it conflicts with any `CONFIRMED` reservation of
        the same item where `startDate <= lockEnd AND lockEndDate >= rentalStartDate` → `409 ASSET_NOT_AVAILABLE`
        naming the latest busy date. `rentalEndDate < rentalStartDate` → `400 BAD_REQUEST`. Unknown asset or
        `bookingId` → `404 NOT_FOUND`. Creates a `CONFIRMED` reservation.
      x-spec-function: FN-ADM-ASSET-01
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
            example:
              assetId: VAY-001
              rentalStartDate: '2026-10-20'
              rentalEndDate: '2026-10-22'
              bookingId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
      responses:
        '201':
          description: Reservation created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ReservationDto'
              example:
                success: true
                code: SUCCESS
                message: Khóa lịch thành công
                data:
                  id: 8c9d0e1f-2a3b-4c4d-9e5f-7a8b9c0d1e2f
                  assetCode: VAY-001
                  startDate: '2026-10-20'
                  endDate: '2026-10-22'
                  lockEndDate: '2026-10-25'
        '400':
          description: '`BAD_REQUEST` — field validation, malformed body or `rentalEndDate` before `rentalStartDate`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validation:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Dữ liệu không hợp lệ
                    errors:
                      - { field: rentalStartDate, message: must not be null }
                endBeforeStart:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Ngày trả phải sau hoặc bằng ngày nhận
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ASSET_NOT_AVAILABLE` — the lock window overlaps an existing rental or its cleaning buffer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: ASSET_NOT_AVAILABLE
                message: Trang phục VAY-001 đang vướng lịch bảo dưỡng giặt hấp đến ngày 17/10/2026, vui lòng chọn ngày khác hoặc trang phục khác.

