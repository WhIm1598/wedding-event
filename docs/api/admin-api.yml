        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/contracts/{id}/share-zalo:
    post:
      tags: [contracts]
      operationId: shareContractZalo
      summary: Send the contract link by Zalo ZNS
      description: |
        Issues a new 30-day public link (the previous link of the contract stops working) and sends the studio's
        approved ZNS template from its own Zalo OA (FN-ADM-SET-02) with `template_data`
        `{customer_name, contract_number, total_amount, contract_url}`. A definite refusal keeps the previous link; when Zalo's
        answer is lost (timeout, HTTP error) the new link is kept, because the message may have arrived.
        The OA access token is refreshed in its own transaction, so the rotated single-use refresh token is kept.
      x-spec-function: FN-ADM-CONTR-01
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareZaloRequest'
            example:
              phoneNumber: '0901112222'
      responses:
        '200':
          description: Message accepted by Zalo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ShareResultDto'
        '400':
          description: '`ZALO_NOT_AVAILABLE` (no phoneNumber and the customer has no Zalo), `ZALO_OA_NOT_CONFIGURED`, or `BAD_REQUEST` for an invalid phoneNumber.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: '`ZALO_OA_AUTH_FAILED` (token refresh refused: reconnect the OA) or `ZALO_SEND_FAILED` (message refused; the message carries Zalos error code).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/admin/contracts/{id}/revoke-link:
    post:
      tags: [contracts]
      operationId: revokeContractLink
      summary: Revoke the public contract link
      description: The shared link answers `410 SHARE_LINK_EXPIRED` from now on; sharing again issues a new one.
      x-spec-function: FN-PUB-CONTR-01
      x-roles: [ROLE_ADMIN]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Link revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- financials
  /api/v1/admin/financials/transactions:
    get:
      tags: [financials]
      operationId: listTransactions
      summary: Cash book
      description: All transactions (no paging, no filters), newest `transactionDate` first, then newest created.
      x-spec-function: FN-ADM-FIN-03
      x-roles: [ROLE_ADMIN]
      responses:
        '200':
          description: Transactions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TransactionDto'
              example:
                success: true
                code: SUCCESS
                message: Thao tác thành công
                data:
                  - id: 7c8d9e0f-1a2b-4c3d-8e4f-6a7b8c9d0e1f
                    code: TRX-012
                    transactionDate: '2026-10-03'
                    description: Thanh toán cọc hợp đồng Lê Hoàng C
                    type: INCOME
                    amount: 2500000
                    category: Doanh thu HĐ
                    contractId: 6b7c8d9e-0f1a-4b2c-9d3e-5f6a7b8c9d0e
                  - id: 8d9e0f1a-2b3c-4d4e-9f5a-7b8c9d0e1f2a
                    code: TRX-011
                    transactionDate: '2026-10-02'
                    description: In album photobook khách Mai Huy
                    type: EXPENSE
                    amount: 1200000
                    category: Chi phí in ấn
                    contractId: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [financials]
      operationId: createTransaction
      summary: Record an income or expense
      description: |
        `transactionDate` after today → `400 BAD_REQUEST`; unknown `contractId` → `404 NOT_FOUND`. Generates
        `TRX-xxx`. For an `INCOME` linked to a contract: contract `COMPLETED` → `409 CONTRACT_NOT_PAYABLE`;
        `amount > remainingAmount` → `400 PAYMENT_EXCEEDS_REMAINING`; otherwise adds to `paidAmount`, recomputes
        `remainingAmount` and moves `DRAFT → DEPOSITED` (the contract's customer, if still before `IN_PROGRESS`,
        moves to `IN_PROGRESS`). A `DEPOSITED` contract that already has a booking `IN_PROGRESS`/`COMPLETED` (shot
        before the deposit) moves straight on to `IN_PROGRESS`. Paying in full completes the contract only if it was already delivered
        (`COMPLETED` = paid in full AND delivered, §1.6); otherwise it keeps its status. Notification "Hợp đồng đã
        thanh toán đủ" when nothing remains, else "Đã thu tiền". An `EXPENSE` with `contractId` does not change the debt.
        Concurrent updates of the same contract → `409 CONCURRENT_MODIFICATION` (optimistic lock).
      x-spec-function: FN-ADM-FIN-01
      x-roles: [ROLE_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            example:
              type: INCOME
              amount: 2500000
              category: Doanh thu HĐ
              description: Thanh toán cọc hợp đồng Lê Hoàng C
              contractId: 6b7c8d9e-0f1a-4b2c-9d3e-5f6a7b8c9d0e
              transactionDate: '2026-10-03'
      responses:
        '201':
          description: Transaction recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TransactionDto'
              example:
                success: true
                code: SUCCESS
                message: Đã ghi nhận giao dịch
                data:
                  id: 7c8d9e0f-1a2b-4c3d-8e4f-6a7b8c9d0e1f
                  code: TRX-012
                  transactionDate: '2026-10-03'
                  description: Thanh toán cọc hợp đồng Lê Hoàng C
                  type: INCOME
                  amount: 2500000
                  category: Doanh thu HĐ
                  contractId: 6b7c8d9e-0f1a-4b2c-9d3e-5f6a7b8c9d0e
        '400':
          description: '`BAD_REQUEST` (field validation, malformed body, future `transactionDate`) or `PAYMENT_EXCEEDS_REMAINING`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validation:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Dữ liệu không hợp lệ
                    errors:
                      - { field: amount, message: must be greater than 0 }
                futureDate:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Ngày giao dịch không được sau ngày hôm nay
                paymentExceedsRemaining:
                  value:
                    success: false
                    code: PAYMENT_EXCEEDS_REMAINING
                    message: Số tiền thu vượt quá công nợ còn lại của hợp đồng (10.000.000đ)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONTRACT_NOT_PAYABLE` (contract already `COMPLETED`, i.e. paid and delivered) or `CONCURRENT_MODIFICATION`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                contractNotPayable:
                  value:
                    success: false
                    code: CONTRACT_NOT_PAYABLE
                    message: Hợp đồng HD-103 đã hoàn tất, không thể ghi thêm khoản thu
                concurrentModification:
                  value:
                    success: false
                    code: CONCURRENT_MODIFICATION
                    message: Dữ liệu vừa được người khác cập nhật, vui lòng tải lại

