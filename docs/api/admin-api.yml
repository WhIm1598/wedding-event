      x-spec-function: FN-ADM-USER-01
      x-roles: [ROLE_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              email: tuan@lumiere.vn
