openapi: 3.1.0
info:
  title: Lumière Studios Admin API
  version: 0.1.0
  summary: REST API of admin-console/backend (web admin for studio staff).
  description: |
    Contract of `admin-console/backend` as implemented in the code. The source of truth for business rules is
    `docs/features/detailed_functional_specification.md` (Part B); each operation links its spec function via
    `x-spec-function`. Where code and spec differ, this file follows the code.

    **Conventions**
    * Every response uses the envelope of spec §1.2 (`ApiSuccess` / `ApiError`). `data` and `errors` are omitted
      when null (operations without payload return no `data`).
    * Money is integer VND, dates `YYYY-MM-DD`, times `HH:mm` (24h), timestamps ISO 8601 UTC. "Today" and "this month"
      are evaluated in the business time zone `Asia/Ho_Chi_Minh`.
    * Authentication: `Authorization: Bearer <accessToken>` (JWT HS256, 2 h). Only tokens with `typ=access` are
      accepted; refresh tokens (30 days) can only be used on `POST /auth/refresh`.
    * Authorization (spec §1.5) is enforced twice: URL rules in `SecurityConfig` (evaluated before body parsing, so
      `ROLE_STAFF` receives `403` instead of `400` on admin-only routes) and `@PreAuthorize` on the controllers.
      Each operation lists its roles in `x-roles`.
    * Generic errors not repeated on every operation: `405 METHOD_NOT_ALLOWED` (unsupported HTTP method) and
      `500 INTERNAL_SERVER_ERROR` (unexpected failure), both in the `ApiError` envelope.
    * User-facing messages are Vietnamese.
servers:
  - url: http://localhost:8082
    description: Local admin backend (`./gradlew :admin-console:backend:bootRun`)
  - url: https://{host}
    description: Through the nginx gateway (forwards `/api/v1/admin/**` to this service)
    variables:
      host:
        default: localhost
        description: Public host name of the gateway
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Admin console login, token refresh and current user (Module 5A).
  - name: dashboard
    description: Executive KPIs and revenue chart (Module 5). Admin only.
  - name: bookings
    description: Smart booking calendar and appointment dispatch (Module 6).
  - name: packages
    description: Studio service packages (Module 9).
  - name: assets
    description: Wardrobe & equipment with the maintenance-buffer lock (Module 8).
  - name: staff
    description: Staff members and task assignment (Module 9).
  - name: crm
    description: CRM pipeline (Kanban) of leads (Module 7).
  - name: contracts
    description: Contracts, A4 preview/PDF export and Zalo sharing (Module 7).
  - name: financials
    description: Cash book (Module 5). Admin only.
  - name: notifications
    description: In-app notifications of the studio team (Module 9).
  - name: search
    description: Global header search (Ctrl+K) (Module 9).
  - name: settings
    description: Studio profile printed as party B on contracts (Module 9).
  - name: users
    description: Admin-console login accounts (Module 5A, FN-ADM-USER-01). Admin only.
  - name: public
    description: The customer's contract page behind the Zalo link (FN-PUB-CONTR-01). No login; the token is the credential; the gateway allows 30 requests/minute/IP.

paths:
  # ---------------------------------------------------------------- auth
  /api/v1/admin/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in to the admin console
      description: |
        Looks the user up by email (case-insensitive). Unknown email, wrong password or a role other than
        `ROLE_ADMIN`/`ROLE_STAFF` all return `401 INVALID_CREDENTIALS` with the same message (no account
        enumeration). An inactive account returns `403 ACCOUNT_LOCKED`. The 5th wrong password in a row locks the
        login for 15 minutes (`429 TOO_MANY_ATTEMPTS`, also for the right password while locked); a successful login
        resets the count. The production gateway also allows at most 20 requests/minute/IP (then a plain nginx 429).
        On success returns an access token (2 h) and a refresh token (30 days, with a `jti` claim stored in
        `refresh_tokens`) with claims `sub`, `email`, `name`, `roles`, `staffId` (when the account is linked to a
        staff member) and `typ`.
      x-spec-function: FN-ADM-AUTH-01
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@lumiere.vn
              password: MatKhau@2026
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                code: SUCCESS
                message: Đăng nhập thành công
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.ACCESS-TOKEN-PLACEHOLDER.signature
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.REFRESH-TOKEN-PLACEHOLDER.signature
                  user:
                    id: 0c9a7f4e-2b1d-4c3e-9f8a-1b2c3d4e5f60
                    name: Quản Lý Studio
                    email: admin@lumiere.vn
                    role: ROLE_ADMIN
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`INVALID_CREDENTIALS` — wrong email or password, or not a console account.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: INVALID_CREDENTIALS
                message: Email hoặc mật khẩu không chính xác
        '403':
          description: '`ACCOUNT_LOCKED` — the account is deactivated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: ACCOUNT_LOCKED
                message: Tài khoản đã bị khóa, vui lòng liên hệ quản lý
        '429':
          description: '`TOO_MANY_ATTEMPTS` — 5 wrong passwords in a row; locked for 15 minutes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: TOO_MANY_ATTEMPTS
                message: Đăng nhập sai quá 5 lần, vui lòng thử lại sau 15 phút

  /api/v1/admin/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      description: |
        Rotation: the refresh token must be a valid, unexpired, not revoked and not yet used JWT with `typ=refresh`
        and a `jti`, of an active console user; it is marked used and a new pair is returned. Anything else is
        `401 INVALID_REFRESH_TOKEN`. A used token sent again more than 60 s after its rotation is treated as stolen:
        every refresh token of the user is revoked. Within 60 s (two browser tabs refreshing together) it is only refused.
      x-spec-function: FN-ADM-AUTH-02
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.REFRESH-TOKEN-PLACEHOLDER.signature
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                code: SUCCESS
                message: Thao tác thành công
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.ACCESS-TOKEN-PLACEHOLDER.signature
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.REFRESH-TOKEN-PLACEHOLDER.signature
                  user:
                    id: 5d6e7f80-91a2-4b3c-8d4e-5f6a7b8c9d0e
                    name: Hương Sale
                    email: staff@lumiere.vn
                    role: ROLE_STAFF
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`INVALID_REFRESH_TOKEN` — invalid, expired, revoked or already used token, or the user is inactive / no longer a console user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: INVALID_REFRESH_TOKEN
                message: Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại

  /api/v1/admin/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token
      description: Marks the refresh token revoked. Always `200`, also for an unknown, expired or malformed token.
      x-spec-function: FN-ADM-AUTH-04
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
              example:
                success: true
                code: SUCCESS
                message: Đã đăng xuất
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/admin/auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Revoke every refresh token of the caller
      description: Every session must sign in again once its access token (max 2 h) runs out.
      x-spec-function: FN-ADM-AUTH-04
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      responses:
        '200':
          description: All sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
              example:
                success: true
                code: SUCCESS
                message: Đã đăng xuất khỏi mọi thiết bị
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the caller's own password
      description: |
        `currentPassword` wrong → `400 WRONG_PASSWORD`. `newPassword`: 8–100 characters with letters and digits,
        different from the current one (`400 BAD_REQUEST` with a `newPassword` field error). On success every refresh
        token of the user is revoked and a new pair is returned for the calling session.
      x-spec-function: FN-ADM-AUTH-04
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: MatKhau@2026
              newPassword: MatKhauMoi2027
      responses:
        '200':
          description: Password changed; new token pair.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          description: '`WRONG_PASSWORD`, or `BAD_REQUEST` with field errors for `newPassword`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: WRONG_PASSWORD
                message: Mật khẩu hiện tại không đúng
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get the logged-in user
      description: Returns the user of the access token. `401 UNAUTHORIZED` when the user is no longer active or lost the console role (checked on every request; a token whose role or staff link differs from the database is refused).
      x-spec-function: FN-ADM-AUTH-03
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthUserDto'
              example:
                success: true
                code: SUCCESS
                message: Thao tác thành công
                data:
                  id: 0c9a7f4e-2b1d-4c3e-9f8a-1b2c3d4e5f60
                  name: Quản Lý Studio
                  email: admin@lumiere.vn
                  role: ROLE_ADMIN
        '401':
          description: Missing/invalid/expired access token, or the user is inactive / no longer a console user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidToken:
                  value:
                    success: false
                    code: UNAUTHORIZED
                    message: Phiên đăng nhập không hợp lệ hoặc đã hết hạn
                userInactive:
                  value:
                    success: false
                    code: UNAUTHORIZED
                    message: Phiên đăng nhập không hợp lệ

  # ---------------------------------------------------------------- dashboard
  /api/v1/admin/dashboard/stats:
    get:
      tags: [dashboard]
      operationId: getDashboardStats
      summary: Executive KPIs
      description: |
        "This month" vs "last month" are calendar months in `Asia/Ho_Chi_Minh`.
        * `monthlyRevenue.amount` — sum of `INCOME` transactions dated this month; `formatted` is the VND display string.
        * `activeContractsCount.value` — contracts currently `DEPOSITED` or `IN_PROGRESS`; trend compares contracts
          signed (`contractDate`) this month vs last month.
        * `pendingLeadsCount.value` — leads in `NEW_LEAD` or `IN_CONSULTATION`; trend compares such leads created this
          month vs last month.
        * `costumeRentalRate.percentage` — dresses + suits `IN_USE` today / all dresses + suits × 100 (0 when there are
          none); its `trendPercentage` is the percentage-point difference with the same day last month.
        * `trendPercentage` (first three) = (current − previous) / previous × 100; 100 when previous is 0 and current
          > 0, 0 when both are 0. All percentages rounded to 1 decimal (HALF_UP); `isIncrease = trendPercentage >= 0`
          (rental rate: `percentage >= lastMonthPercentage`).
      x-spec-function: FN-ADM-DASH-01
      x-roles: [ROLE_ADMIN]
      responses:
        '200':
          description: KPIs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/StatsDto'
              example:
                success: true
                code: SUCCESS
                message: Thao tác thành công
                data:
                  monthlyRevenue: { amount: 245000000, formatted: 245.000.000đ, trendPercentage: 12.5, isIncrease: true }
                  activeContractsCount: { value: 42, trendPercentage: 5.0, isIncrease: true }
                  pendingLeadsCount: { value: 8, trendPercentage: -2.0, isIncrease: false }
                  costumeRentalRate: { percentage: 78.0, trendPercentage: 15.0, isIncrease: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/dashboard/revenue-chart:
    get:
      tags: [dashboard]
      operationId: getRevenueChart
      summary: Monthly revenue of a year
      description: Always 12 points (months 1–12); months without `INCOME` transactions have `amount = 0`.
      x-spec-function: FN-ADM-DASH-02
      x-roles: [ROLE_ADMIN]
      parameters:
        - name: year
          in: query
          required: false
          description: Calendar year; defaults to the current year (Asia/Ho_Chi_Minh).
          schema:
            type: integer
            format: int32
          example: 2026
      responses:
        '200':
          description: 12 monthly totals.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        type: array
                        minItems: 12
                        maxItems: 12
                        items:
                          $ref: '#/components/schemas/RevenuePoint'
              example:
                success: true
                code: SUCCESS
                message: Thao tác thành công
                data:
                  - { month: 1, amount: 40000000 }
                  - { month: 2, amount: 70000000 }
                  - { month: 3, amount: 45000000 }
                  - { month: 4, amount: 90000000 }
                  - { month: 5, amount: 65000000 }
                  - { month: 6, amount: 85000000 }
                  - { month: 7, amount: 100000000 }
                  - { month: 8, amount: 50000000 }
                  - { month: 9, amount: 75000000 }
                  - { month: 10, amount: 12500000 }
                  - { month: 11, amount: 0 }
                  - { month: 12, amount: 0 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- bookings
  /api/v1/admin/bookings/calendar:
    get:
      tags: [bookings]
      operationId: getBookingCalendar
      summary: Bookings of a day, week or month
      description: |
        Range: `day` = that date; `week` = Monday–Sunday containing `date`; `month` = the calendar month containing
        `date`. Sorted by `date`, `time`. `CANCELLED` bookings are hidden unless `includeCancelled=true`.
        `ROLE_STAFF` always sees only the bookings assigned to their own staff member (the `staffId` claim of the
        JWT) and the `staffId` parameter is ignored; a staff account not linked to a staff member gets an empty list.
      x-spec-function: FN-ADM-CAL-01
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      parameters:
        - name: view
          in: query
          required: false
          description: Calendar view (case-insensitive). Any other value → `400 BAD_REQUEST`.
          schema:
            type: string
            enum: [day, week, month]
            default: day
        - name: date
          in: query
          required: false
          description: Anchor date; defaults to today (Asia/Ho_Chi_Minh).
          schema:
            type: string
            format: date
          example: '2026-10-03'
        - name: staffId
          in: query
          required: false
          description: Only bookings assigned to this staff member (admins only; ignored for staff).
          schema:
            type: string
            format: uuid
        - name: includeCancelled
          in: query
          required: false
          description: Include `CANCELLED` bookings.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Bookings in the range.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BookingDto'
              example:
                success: true
                code: SUCCESS
                message: Thao tác thành công
                data:
                  - id: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
                    date: '2026-10-03'
                    time: '09:00'
                    clientName: Lan & Hoàng
                    phone: null
                    type: Chụp Pre-wedding
                    packageName: Gói Tiêu Chuẩn (Pre-wedding)
                    venueAddress: Studio Lumière chi nhánh 1
                    status: IN_PROGRESS
                    assignedStaff:
                      - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                        name: Tuấn Photo
                        role: Thợ Chụp Chính
        '400':
          description: '`BAD_REQUEST` — invalid `view`, `date`, `staffId` or `includeCancelled`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidView:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: view phải là day, week hoặc month
                malformed:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Yêu cầu không hợp lệ
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/bookings:
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Create an appointment and assign staff
      description: |
        Creates a booking with status `UPCOMING` and a "Lịch hẹn mới" notification.
        Checks, in order: `eventDate` not before today (`400 BAD_REQUEST`); every `staffIds` entry exists
        (duplicates ignored, `400 STAFF_NOT_FOUND`); no assigned staff member already has another non-cancelled
        booking at exactly the same `eventDate` + `eventTime` (`409 STAFF_SCHEDULE_CONFLICT`, message lists the
        names); `contractId` / `leadId` / `servicePackageId`, when given, exist (`404 NOT_FOUND`). With a
        `contractId` the booking belongs to that contract and its customer: a blank `phone` and a missing
        `servicePackageId` are taken from the contract, and a `leadId` that isn't the contract's customer is
        `400 BAD_REQUEST` (field `leadId`). Blank `phone`/`venueAddress` are otherwise stored as null. Inactive
        packages are not rejected.
      x-spec-function: FN-ADM-CAL-02
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            example:
              clientName: Trang & Hiếu
              phone: '0900000001'
              servicePackageId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
              type: Chụp Pre-wedding
              eventDate: '2026-10-05'
              eventTime: '08:00'
              venueAddress: Studio Lumière chi nhánh 1
              staffIds:
                - 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                - 4d5e6f70-8192-4a3b-8c4d-5e6f7a8b9c0d
      responses:
        '201':
          description: Booking created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/BookingDto'
              example:
                success: true
                code: SUCCESS
                message: Đã thêm lịch trình
                data:
                  id: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                  date: '2026-10-05'
                  time: '08:00'
                  clientName: Trang & Hiếu
                  phone: '0900000001'
                  type: Chụp Pre-wedding
                  packageName: Gói Kim Cương (Ngày Cưới)
                  venueAddress: Studio Lumière chi nhánh 1
                  status: UPCOMING
                  assignedStaff:
                    - { id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, name: Tuấn Photo, role: Thợ Chụp Chính }
                    - { id: 4d5e6f70-8192-4a3b-8c4d-5e6f7a8b9c0d, name: Trang Makeup, role: Chuyên Viên Trang Điểm }
                  contractId: null
        '400':
          description: '`BAD_REQUEST` (field validation, malformed body, `eventDate` in the past, `leadId` not the contract''s customer) or `STAFF_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validation:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Dữ liệu không hợp lệ
                    errors:
                      - { field: eventTime, message: Giờ hẹn phải có dạng HH:mm }
                pastDate:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Ngày hẹn không được ở trong quá khứ
                staffNotFound:
                  value:
                    success: false
                    code: STAFF_NOT_FOUND
                    message: Có nhân sự không tồn tại trong danh sách phân công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`STAFF_SCHEDULE_CONFLICT` — an assigned staff member is already booked at that date and time.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: STAFF_SCHEDULE_CONFLICT
                message: Nhân sự Tuấn Photo đã có lịch vào khung giờ này

  /api/v1/admin/bookings/{id}/status:
    patch:
      tags: [bookings]
      operationId: updateBookingStatus
      summary: Update a booking's execution status
      description: |
        Moves the booking along the §1.6 state machine: `UPCOMING → CONFIRMED | IN_PROGRESS`,
        `CONFIRMED → IN_PROGRESS`, `IN_PROGRESS → COMPLETED`; anything else (including from `COMPLETED`/`CANCELLED`)
        is `409 INVALID_STATUS_TRANSITION`. `UPCOMING` and `CANCELLED` are not accepted here (`400 BAD_REQUEST`,
        field `status`; cancelling is FN-ADM-CAL-03). Staff may only update bookings they are assigned to
        (`403 FORBIDDEN`). When a booking of a `DEPOSITED` contract goes `IN_PROGRESS`, the contract becomes
        `IN_PROGRESS`; a `DRAFT` contract is left as is.
      x-spec-function: FN-ADM-CAL-04
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [CONFIRMED, IN_PROGRESS, COMPLETED]
            example:
              status: IN_PROGRESS
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/BookingDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`INVALID_STATUS_TRANSITION`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: INVALID_STATUS_TRANSITION
                message: Không thể chuyển lịch hẹn từ trạng thái CONFIRMED sang COMPLETED

