  # ---------------------------------------------------------------- contracts
  /api/v1/admin/contracts:
    get:
      tags: [contracts]
      operationId: listContracts
      summary: List contracts
      description: All contracts (no paging), newest `contractDate` first, then newest created.
      x-spec-function: FN-ADM-CONTR-02
      x-roles: [ROLE_ADMIN, ROLE_STAFF]
      responses:
        '200':
          description: Contracts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ContractDto'
              example:
                success: true
                code: SUCCESS
                message: Thao tác thành công
                data:
                  - id: 5a6b7c8d-9e0f-4a1b-8c2d-4e5f6a7b8c9d
                    contractNumber: HD-102
                    customerName: Nguyễn Thị Lan
                    phone: '0900000024'
                    hasZalo: true
                    packageName: Gói Kim Cương (Ngày Cưới)
                    totalAmount: 25000000
                    paidAmount: 10000000
                    remainingAmount: 15000000
                    contractDate: '2026-09-13'
                    status: IN_PROGRESS
                    notes: null
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [contracts]
      operationId: createContract
      summary: Create a contract
      description: |
        `depositAmount > totalAmount` → `400 DEPOSIT_EXCEEDS_TOTAL`; unknown `servicePackageId` → `404 NOT_FOUND`
        (inactive packages are accepted). Generates `HD-xxx`, `contractDate = today`, snapshots the package name,
        links the newest lead with the same phone. `hasZalo` defaults to that lead's `hasZalo` (true when no lead
        matches). When `depositAmount > 0` an `INCOME` transaction "Doanh thu HĐ" is recorded (status becomes
        `DEPOSITED`, otherwise the contract stays `DRAFT`). Only with a deposit does a matching lead in
        `NEW_LEAD`/`IN_CONSULTATION`/`AWAITING_DEPOSIT` move to `IN_PROGRESS`; a draft leaves the lead's stage
        alone. Creates a "Hợp đồng mới" notification.
      x-spec-function: FN-ADM-CONTR-02
      x-roles: [ROLE_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
            example:
              customerName: Lê Hoàng C
              phone: '0900000026'
              servicePackageId: 4e5f6a7b-8c9d-4e0f-9a1b-3c4d5e6f7a8b
              totalAmount: 12500000
              depositAmount: 2500000
              hasZalo: false
              notes: Tặng thêm 1 album mini
      responses:
        '201':
          description: Contract created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ContractDto'
              example:
                success: true
                code: SUCCESS
                message: Đã tạo hợp đồng
                data:
                  id: 6b7c8d9e-0f1a-4b2c-9d3e-5f6a7b8c9d0e
                  contractNumber: HD-105
                  customerName: Lê Hoàng C
                  phone: '0900000026'
                  hasZalo: false
                  packageName: Gói Tiêu Chuẩn (Pre-wedding)
                  totalAmount: 12500000
                  paidAmount: 2500000
                  remainingAmount: 10000000
                  contractDate: '2026-10-03'
                  status: DEPOSITED
                  notes: Tặng thêm 1 album mini
                  deliveredAt: null
        '400':
          description: '`BAD_REQUEST` (field validation / malformed body) or `DEPOSIT_EXCEEDS_TOTAL`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validation:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Dữ liệu không hợp lệ
                    errors:
                      - { field: phone, message: Số điện thoại không hợp lệ }
                depositExceedsTotal:
                  value:
                    success: false
                    code: DEPOSIT_EXCEEDS_TOTAL
                    message: Tiền cọc không được lớn hơn tổng giá trị hợp đồng
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/contracts/{id}/deliver:
    post:
      tags: [contracts]
      operationId: deliverContract
      summary: Confirm the hand-over ("Xác nhận bàn giao")
      description: |
        Records `deliveredAt`. Only an effective contract (`DEPOSITED` or `IN_PROGRESS`, e.g. a rental without bookings) not delivered yet → otherwise
        `409 INVALID_STATUS_TRANSITION`. Paid in full → `COMPLETED` (and its customer → `COMPLETED` once none of
        their contracts is still `DEPOSITED`/`IN_PROGRESS`; abandoned drafts don't count). Still owing → keeps its status; the final payment then completes it.
        Creates a "Đã bàn giao hợp đồng" notification. The `require_full_payment_before_delivery` setting
        (`409 CONTRACT_NOT_PAID`) is not implemented yet.
      x-spec-function: FN-ADM-CONTR-02
      x-roles: [ROLE_ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The updated contract.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ContractDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`INVALID_STATUS_TRANSITION` or `CONCURRENT_MODIFICATION`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: INVALID_STATUS_TRANSITION
                message: Chỉ xác nhận bàn giao được hợp đồng đã đặt cọc và chưa bàn giao

