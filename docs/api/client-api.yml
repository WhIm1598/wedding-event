                  vendorNote: null
                  createdAt: '2026-10-26T03:00:00Z'
                  respondedAt: null
        '400':
          description: '`BAD_REQUEST` (field errors, past `eventDate`) or `PACKAGE_NOT_QUOTABLE`.'
          content:
            application/json:
