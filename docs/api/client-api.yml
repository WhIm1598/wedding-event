openapi: 3.1.0
info:
  title: WedPlanner Mobile API
  version: 0.1.0
  summary: REST API of client-console/backend (WedPlanner mobile app for couples and vendors).
  description: |
    Contract of `client-console/backend` as implemented in the code. The source of truth for business rules is
    `docs/features/detailed_functional_specification.md` (Part A); each operation links its spec function via
    `x-spec-function`. Where code and spec differ, this file follows the code.

    **Conventions**
    * Every response uses the envelope of spec §1.2 (`ApiSuccess` / `ApiError`). `data` and `errors` are omitted
      when null: an operation without payload, and `GET /client/plans/my-plan` without a plan, return no `data` key.
      Fields **inside** `data` are always present (`null` when empty).
    * List endpoints that page return `data` = `{items, page, size, totalElements, totalPages}` (`PageResponse`);
      `page` starts at 0, `size` is 1–100. There is no `sort` parameter.
    * Money is integer VND, dates `YYYY-MM-DD`, timestamps ISO 8601 UTC. "Today" and "this month" are evaluated in
      the business time zone `Asia/Ho_Chi_Minh`.
    * Authentication: `Authorization: Bearer <accessToken>` (JWT HS256, 2 h, issuer `wedding-event-client`). Only
      tokens with `typ=access` are accepted; admin-console tokens (other issuer) are rejected. There is **no refresh
      endpoint**: the 30-day refresh token returned at login cannot be used yet.
    * The token carries no role. The current role is loaded from the database on every request, so a role chosen
      with `PUT /users/role` applies at once and a locked account (or a studio account) gets `401 UNAUTHORIZED`.
    * Authorization is enforced twice: URL rules in `SecurityConfig.apiSecurity` (evaluated before body parsing, so
      a wrong role receives `403` instead of `400`) and `@PreAuthorize` on the controllers. `x-roles` lists the
      roles; `authenticated` = any signed-in mobile user, including one who has not chosen a role yet.
    * Data that is not the caller's (another couple's plan, guest, quote request, project; another vendor's
      package) is `404 NOT_FOUND`, never `403`.
    * Generic errors not repeated on every operation: `405 METHOD_NOT_ALLOWED` and `500 INTERNAL_SERVER_ERROR`,
      both in the `ApiError` envelope. Unknown paths are denied (`401` without a token, `403` with one).
    * User-facing messages are Vietnamese.

    **Real-time channel (STOMP over WebSocket, FN-MSG-01 — not used by the app since v1.1.3)**
    OpenAPI cannot describe it, so in short:
    * Endpoint `ws(s)://<host>/ws` (handshake is public). The `CONNECT` frame must carry
      `Authorization: Bearer <accessToken>` of an active `ROLE_COUPLE`/`ROLE_VENDOR` user; otherwise the session
      ends with a STOMP `ERROR` frame.
    * `SEND /app/chat` with the same JSON body as `POST /api/v1/messages/send` (`SendMessageRequest`). Only
      `/app/**` destinations may be sent to.
    * `SUBSCRIBE /topic/messages/{roomId}` — only members of that room; receives every `MessageDto` of the room
      after it is saved (REST or STOMP).
    * `SUBSCRIBE /user/queue/errors` — errors of the caller's `SEND` frames, in the `ApiError` envelope
      (`BAD_REQUEST` with `errors[]`, `INVALID_RECIPIENT`, `INTERNAL_SERVER_ERROR`).
    * Single instance: in-memory simple broker and presence tracking.
servers:
  - url: http://localhost:8081
    description: Local mobile backend (`./gradlew :client-console:backend:bootRun`)
  - url: https://{host}
    description: Through the nginx gateway (forwards `/api/v1/auth|users|client|messages/**` and `/ws/**` to this service)
    variables:
      host:
        default: localhost
        description: Public host name of the gateway
security:
  - bearerAuth: []
tags:
  - name: auth
    description: E-mail and Google sign-in, e-mail OTP, current user (Module 1).
  - name: user
    description: Role picker and profile (Module 1).
  - name: plan
    description: The couple's wedding plan, AI planner, partner sync and checklist (Module 2). `ROLE_COUPLE`.
  - name: guest
    description: Guest list and RSVP of the couple's plan (Module 3). `ROLE_COUPLE`.
  - name: catalog
    description: Active service packages of vendors and of the studio (Module 4). Couples and vendors.
  - name: notification
    description: In-app inbox of the signed-in user (FN-NOTI-01).
  - name: message
    description: |
      Couple ↔ vendor chat (FN-MSG-01). Kept in the backend but **not used by the app** since v1.1.3 (couples contact
      the studio and vendors on Zalo). The same operation exists over STOMP (`SEND /app/chat`), see the API
      description.
  - name: project
    description: Vendor projects created from accepted quotes — couple side (`/client/vendor-projects`) and vendor side (`/client/vendor/projects`) (Module 4B).
  - name: quote
    description: Quote requests — couple side (`/client/quote-requests`) and vendor side (`/client/vendor/quote-requests`) (Module 4B).
  - name: vendor
    description: Vendor dashboard and the vendor's own service packages (Module 4B). `ROLE_VENDOR`.

paths:
  # ---------------------------------------------------------------- auth
  /api/v1/auth/google:
    post:
      tags: [auth]
      operationId: loginWithGoogle
      summary: Sign in with a Google ID token
      description: |
        Verifies the Google ID token (audience = `app.google.client-ids`; empty config = Google login off →
        `401 INVALID_GOOGLE_TOKEN`). Only Google-verified e-mail addresses are accepted (`401 INVALID_GOOGLE_TOKEN`).
        The account is found by Google's user id (`sub`); without one yet, the account with the same e-mail is linked,
        or a new account is created with no role (`role = null`) and `isVerified = true`.
        A mobile account with that e-mail that is unverified, or already linked to another Google user →
        `409 EMAIL_EXISTS` (no account merge). A studio account (admin/staff) → `401 INVALID_CREDENTIALS`.
        A locked account → `403 ACCOUNT_LOCKED`. Not a separate function in the detailed spec (error codes in §1.3;
        product spec §7.1).
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
            example:
              idToken: eyJhbGciOiJSUzI1NiJ9.GOOGLE-ID-TOKEN-PLACEHOLDER.signature
      responses:
        '200':
          $ref: '#/components/responses/LoginOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`INVALID_GOOGLE_TOKEN` — token invalid/expired, Google login not configured, or e-mail not verified by Google; `INVALID_CREDENTIALS` — studio account.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidGoogleToken:
                  value:
                    success: false
                    code: INVALID_GOOGLE_TOKEN
                    message: Email Google chưa được xác thực, vui lòng xác thực email với Google trước
                studioAccount:
                  value:
                    success: false
                    code: INVALID_CREDENTIALS
                    message: Email hoặc mật khẩu không chính xác
        '403':
          $ref: '#/components/responses/AccountLocked'
        '409':
          description: '`EMAIL_EXISTS` — an unverified account, or one linked to another Google user, already has this e-mail.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: EMAIL_EXISTS
                message: Email này đã gắn với một tài khoản khác, vui lòng liên hệ hỗ trợ

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with e-mail and password
      description: |
        Looks the user up by e-mail (case-insensitive). Unknown e-mail, wrong password or a studio account
        (`ROLE_ADMIN`/`ROLE_STAFF`) all return `401 INVALID_CREDENTIALS` with the same message (no account
        enumeration, equal response time). An inactive account returns `403 ACCOUNT_LOCKED`. An unverified account
        is sent a new OTP (max 5 codes per hour) but still receives the tokens; the app keeps the user on the OTP
        screen (`user.isVerified = false`). Access token 2 h, refresh token 30 days, claims `sub`, `email`, `typ`.
      x-spec-function: FN-AUTH-01
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ngoc.hoang@example.com
              password: MatKhau@2026
      responses:
        '200':
          $ref: '#/components/responses/LoginOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`INVALID_CREDENTIALS` — wrong e-mail or password, or a studio account.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: INVALID_CREDENTIALS
                message: Email hoặc mật khẩu không chính xác
        '403':
          $ref: '#/components/responses/AccountLocked'

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get the signed-in user
      description: Returns the `user` object of the access token's account. Works before a role is chosen.
      x-roles: [authenticated]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UserDto'
              example:
                success: true
                code: SUCCESS
                message: Thao tác thành công
                data:
                  id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  email: ngoc.hoang@example.com
                  fullName: Ngọc & Hoàng
                  phone: '0900000001'
                  avatarUrl: null
                  role: ROLE_COUPLE
                  hasPlan: true
                  isVerified: true
                  pendingEmail: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/send-otp:
    post:
      tags: [auth]
      operationId: sendOtp
      summary: (Re)send an e-mail OTP
      description: |
        Always `200` with the same message, whether or not the e-mail has an account (no account probing). A new
        4-digit code (valid 5 min) is sent only to an active, unverified account with this e-mail, or to an active
        account whose pending new e-mail (FN-AUTH-04) is this address. At most 5 codes per account per hour: over the
        limit nothing is sent, the previous code stays valid, and the answer is still `200`.
      x-spec-function: FN-AUTH-02
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
            example:
              email: ngoc.hoang@example.com
      responses:
        '200':
          description: Accepted (no `data`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
              example:
                success: true
                code: SUCCESS
                message: Nếu email hợp lệ, mã OTP đã được gửi
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/verify-otp:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Confirm an e-mail address with its OTP
      description: |
        The code is checked against every live code sent to this address (a code proves only the address it was sent
        to). Wrong code, or no code for this address → `400 INVALID_OTP` (each wrong try is counted). Expired (5 min)
        or disabled after 5 wrong tries → `400 OTP_EXPIRED` (request a new one with `send-otp`). Success on the
        account's e-mail sets `isVerified = true`; on a pending new e-mail it replaces the account's e-mail, unless
        another account took that address meanwhile (`409 EMAIL_EXISTS`, the change is dropped). Codes are single use.
      x-spec-function: FN-AUTH-02
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            example:
              email: ngoc.hoang@example.com
              otpCode: '8421'
      responses:
        '200':
          description: E-mail verified (no `data`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
              example:
                success: true
                code: SUCCESS
                message: Xác thực email thành công
        '400':
          description: '`BAD_REQUEST` (field errors), `INVALID_OTP` or `OTP_EXPIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validation:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Dữ liệu không hợp lệ
                    errors:
                      - { field: otpCode, message: Mã OTP gồm đúng 4 chữ số }
                invalidOtp:
                  value:
                    success: false
                    code: INVALID_OTP
                    message: Mã OTP không chính xác
                otpExpired:
                  value:
                    success: false
                    code: OTP_EXPIRED
                    message: Mã OTP đã hết hạn hoặc bị vô hiệu hóa, vui lòng yêu cầu gửi lại mã
        '409':
          description: '`EMAIL_EXISTS` — confirming a pending new e-mail that another account now uses.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: EMAIL_EXISTS
                message: Email đã được sử dụng bởi tài khoản khác

  # ---------------------------------------------------------------- user
  /api/v1/users/me:
    put:
      tags: [user]
      operationId: updateProfile
      summary: Update the profile
      description: |
        Updates `fullName` and `phone` (blank phone clears it). A new `email` does not replace the current one: it is
        stored as `pendingEmail` and an OTP is sent to it; it replaces `email` when confirmed with
        `POST /auth/verify-otp`. Sending the current e-mail again cancels a pending change. An e-mail used by another
        account → `409 EMAIL_EXISTS`. The vendor's `phone` is also its Zalo contact in the catalog (`zaloUrl`).
      x-spec-function: FN-AUTH-04
      x-roles: [authenticated]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
            example:
              fullName: Ngọc & Hoàng
              email: ngoc.hoang.moi@example.com
              phone: '0900000001'
      responses:
        '200':
          $ref: '#/components/responses/UserOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`EMAIL_EXISTS` — another account uses this e-mail.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: EMAIL_EXISTS
                message: Email đã được sử dụng bởi tài khoản khác

  /api/v1/users/role:
    put:
      tags: [user]
      operationId: selectRole
      summary: Choose the account's role (once)
      description: |
        Only `ROLE_COUPLE` or `ROLE_VENDOR`. The role can be chosen once (`409 ROLE_ALREADY_SET` afterwards). A couple
        gets a `DRAFT` plan (not counted as a plan: `hasPlan = false`); a vendor gets a default vendor profile named
        after the user. Until a role is chosen, only `/auth/me`, `/users/**` and the inbox are allowed.
      x-spec-function: FN-AUTH-03
      x-roles: [authenticated]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
            example:
              role: ROLE_COUPLE
      responses:
        '200':
          $ref: '#/components/responses/UserOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`ROLE_ALREADY_SET` — the account already has a role.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: ROLE_ALREADY_SET
                message: Bạn đã chọn vai trò cho tài khoản này

  # ---------------------------------------------------------------- plan
  /api/v1/client/plans:
    post:
      tags: [plan]
      operationId: createPlan
      summary: Create the wedding plan manually
      description: |
        Fails with `409 PLAN_ALREADY_EXISTS` when the caller already owns or joined a `PLANNING` plan. `weddingDate`
        must be at least 7 days after today (`400` on `weddingDate`); the sum of `allocatedAmount` may not exceed
        150 % of `totalBudget` (`400` on `categories`). Reuses the `DRAFT` created at role selection, creates one
        budget item per category (`PLANNED`, actual 0) and the default checklist dated from the wedding date.
      x-spec-function: FN-PLAN-01
      x-roles: [ROLE_COUPLE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
            example:
              weddingDate: '2027-03-20'
              engagementDate: '2027-03-15'
              totalBudget: 300000000
              categories:
                - { name: Nhà hàng & Tiệc, allocatedAmount: 150000000 }
                - { name: Chụp ảnh & Quay phim, allocatedAmount: 30000000 }
      responses:
        '201':
          $ref: '#/components/responses/PlanCreated'
        '400':
          description: '`BAD_REQUEST` — field validation, wedding date too close, or allocation over 150 %.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                weddingDate:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Dữ liệu không hợp lệ
                    errors:
                      - { field: weddingDate, message: Ngày cưới phải sau ngày hiện tại ít nhất 7 ngày }
                allocation:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Dữ liệu không hợp lệ
                    errors:
                      - { field: categories, message: Tổng phân bổ các danh mục vượt quá 150% ngân sách }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PlanAlreadyExists'

  /api/v1/client/plans/ai-generate:
    post:
      tags: [plan]
      operationId: generatePlanWithAi
      summary: Let the AI planner create the wedding plan
      description: |
        Same preconditions as `createPlan` (`409 PLAN_ALREADY_EXISTS`). Without `weddingDate` the plan is dated
        today + 6 months; a given date must be at least 7 days after today. The AI planner (or the built-in
        rule-based planner when `app.ai-planner.base-url` is empty) is called outside any transaction; an error,
        timeout (30 s) or empty plan → `503 AI_SERVICE_UNAVAILABLE`. Task due date = wedding date − `dueMonthOffset`
        months (offset 0 → one week before). Category notes are kept in `budgetItems[].notes`. Success stores an inbox
        notification `kind = ai` "Kế hoạch đã sẵn sàng".
      x-spec-function: FN-PLAN-03
      x-roles: [ROLE_COUPLE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGenerateRequest'
            example:
              prompt: Ngân sách của chúng mình là 250 triệu, muốn cưới phong cách thanh lịch tại TP.HCM, mời khoảng 200 khách.
              totalBudget: 250000000
              weddingDate: '2027-03-20'
              guestCount: 200
              style: ELEGANT
      responses:
        '201':
          $ref: '#/components/responses/PlanCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PlanAlreadyExists'
        '503':
          description: '`AI_SERVICE_UNAVAILABLE` — the AI planner failed, timed out or returned an empty plan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: AI_SERVICE_UNAVAILABLE
                message: Trợ lý AI đang bận, vui lòng thử lại sau hoặc tạo kế hoạch thủ công

  /api/v1/client/plans/join-sync:
    post:
      tags: [plan]
      operationId: joinPlanSync
      summary: Join the partner's plan with a sync code
      description: |
        The code is case-insensitive. Unknown, used or expired code, or a plan no longer `PLANNING` →
        `400 INVALID_SYNC_CODE`. Own code → `409 CANNOT_JOIN_OWN_PLAN`; plan already has a partner →
        `409 PLAN_ALREADY_SYNCED`; the caller already has a `PLANNING` plan → `409 PLAN_ALREADY_EXISTS`. The caller's
        `DRAFT` plan is deleted, the code row is locked and marked used, and both members get an inbox notification
        `kind = sync` (+ push). Returns the shared plan as seen by the caller (`partner` = the owner).
      x-spec-function: FN-PLAN-04
      x-roles: [ROLE_COUPLE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSyncRequest'
            example:
              syncCode: 8A9B2C
      responses:
        '200':
          description: Joined; the shared plan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PlanDto'
        '400':
          description: '`BAD_REQUEST` (code not 6 letters/digits) or `INVALID_SYNC_CODE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validation:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Dữ liệu không hợp lệ
                    errors:
                      - { field: syncCode, message: Mã kết nối gồm 6 ký tự }
                invalidSyncCode:
                  value:
                    success: false
                    code: INVALID_SYNC_CODE
                    message: Mã kết nối không hợp lệ hoặc đã hết hạn
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`CANNOT_JOIN_OWN_PLAN`, `PLAN_ALREADY_SYNCED` or `PLAN_ALREADY_EXISTS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ownPlan:
                  value:
                    success: false
                    code: CANNOT_JOIN_OWN_PLAN
                    message: Bạn không thể dùng mã kết nối của chính mình
                alreadySynced:
                  value:
                    success: false
                    code: PLAN_ALREADY_SYNCED
                    message: Kế hoạch đã được kết nối với bạn đời
                planExists:
                  value:
                    success: false
                    code: PLAN_ALREADY_EXISTS
                    message: Bạn đã có kế hoạch cưới đang hoạt động

  /api/v1/client/plans/my-plan:
    get:
      tags: [plan]
      operationId: getMyPlan
      summary: Get the caller's wedding plan
      description: |
        The `PLANNING` plan the caller owns or joined as partner. Without one (a `DRAFT` does not count) the answer
        is `200` **without a `data` key** (the envelope omits null). `daysRemaining = max(0, weddingDate − today)`;
        `totalSpent = Σ actualAmount`; `spentPercentage = totalSpent / totalBudget × 100` and
        `progressPercentage = completedTasks / totalTasks × 100`, both HALF_UP to 1 decimal and 0 when the divisor is 0.
        `partner` is the other member of the couple (null before sync). Budget items by position; tasks by due date.
      x-spec-function: FN-PLAN-02
      x-roles: [ROLE_COUPLE]
      responses:
        '200':
          description: The plan, or no `data` when the caller has no plan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PlanDto'
              examples:
                plan:
                  value:
                    success: true
                    code: SUCCESS
                    message: Thao tác thành công
                    data:
                      planId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      weddingDate: '2027-03-20'
                      engagementDate: '2027-03-15'
                      daysRemaining: 145
                      totalBudget: 300000000
