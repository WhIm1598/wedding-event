components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/v1/auth/login` or `/google` (HS256, issuer `wedding-event-client`, `typ=access`, 2 hours).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Page number, from 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    QuoteStatus:
      name: status
      in: query
      description: A `QuoteRequestStatus` (case-insensitive); anything else → `400` on `status`. Blank = all.
      schema:
        type: string
        examples: [PENDING]

  responses:
    BadRequest:
      description: |
        `BAD_REQUEST` — body validation failed (`errors[]` lists each field), a query parameter is out of range
        (`errors[]` with the parameter name, message "Tham số không hợp lệ"), or the request is malformed
        (unparsable JSON, unknown enum value, non-UUID id; no `errors[]`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validation:
              value:
                success: false
                code: BAD_REQUEST
                message: Dữ liệu không hợp lệ
                errors:
                  - { field: name, message: Tên khách mời không được để trống }
            parameter:
              value:
                success: false
                code: BAD_REQUEST
                message: Tham số không hợp lệ
                errors:
                  - { field: size, message: must be less than or equal to 100 }
            malformed:
              value:
                success: false
                code: BAD_REQUEST
                message: Yêu cầu không hợp lệ
    Unauthorized:
      description: '`UNAUTHORIZED` — missing, invalid or expired access token, a refresh/admin token, or the account is locked, unknown or a studio account.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: UNAUTHORIZED
            message: Phiên đăng nhập không hợp lệ hoặc đã hết hạn
    Forbidden:
      description: '`FORBIDDEN` — the caller''s role (or no role yet) may not call this route.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: FORBIDDEN
            message: Bạn không có quyền thực hiện thao tác này
    NotFound:
      description: '`NOT_FOUND` — the record does not exist or is not the caller''s (also: the vendor has no vendor profile). Message: `Không tìm thấy <tài nguyên> (<id>)`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: NOT_FOUND
            message: Không tìm thấy yêu cầu báo giá (0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d)
    NoPlan:
      description: '`NOT_FOUND` — the caller has no `PLANNING` plan.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: NOT_FOUND
            message: Bạn chưa có kế hoạch cưới
    AccountLocked:
      description: '`ACCOUNT_LOCKED` — the account is deactivated.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: ACCOUNT_LOCKED
            message: Tài khoản đã bị khóa, vui lòng liên hệ hỗ trợ
    PlanAlreadyExists:
      description: '`PLAN_ALREADY_EXISTS` — the caller already owns or joined a `PLANNING` plan.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: PLAN_ALREADY_EXISTS
            message: Bạn đã có kế hoạch cưới đang hoạt động
    QuoteConflict:
      description: '`INVALID_STATUS_TRANSITION` — not allowed from the current status (§1.6); `CONCURRENT_MODIFICATION` — the request was changed at the same time.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            invalidTransition:
              value:
                success: false
                code: INVALID_STATUS_TRANSITION
                message: Yêu cầu báo giá đang ở trạng thái ACCEPTED, không thể thực hiện thao tác này
            concurrent:
              value:
                success: false
                code: CONCURRENT_MODIFICATION
                message: Dữ liệu vừa được người khác cập nhật, vui lòng tải lại
    ProjectConflict:
      description: '`INVALID_STATUS_TRANSITION` — not allowed from the current status / no pending cancellation request (§1.6); `CONCURRENT_MODIFICATION` — the project was changed at the same time.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            invalidTransition:
              value:
                success: false
                code: INVALID_STATUS_TRANSITION
                message: Không thể chuyển dự án từ COMPLETED sang IN_PROGRESS
            noPendingCancel:
              value:
                success: false
                code: INVALID_STATUS_TRANSITION
                message: Dự án không có yêu cầu hủy đang chờ duyệt
            concurrent:
              value:
                success: false
                code: CONCURRENT_MODIFICATION
                message: Dữ liệu vừa được người khác cập nhật, vui lòng tải lại
    VendorServiceBadRequest:
      description: '`BAD_REQUEST` — field validation, or `discountPrice` not lower than `price`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validation:
              value:
                success: false
                code: BAD_REQUEST
                message: Dữ liệu không hợp lệ
                errors:
                  - { field: category, message: 'Danh mục chỉ có thể là photo, decor, restaurant hoặc dress' }
            discount:
              value:
                success: false
                code: BAD_REQUEST
                message: Dữ liệu không hợp lệ
                errors:
                  - { field: discountPrice, message: Giá sau giảm phải thấp hơn giá gốc }
    LoginOk:
      description: Signed in.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'
          example:
            success: true
            code: SUCCESS
            message: Đăng nhập thành công
            data:
              accessToken: eyJhbGciOiJIUzI1NiJ9.ACCESS-TOKEN-PLACEHOLDER.signature
              refreshToken: eyJhbGciOiJIUzI1NiJ9.REFRESH-TOKEN-PLACEHOLDER.signature
              user:
                id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                email: ngoc.hoang@example.com
                fullName: Ngọc & Hoàng
                phone: null
                avatarUrl: null
                role: ROLE_COUPLE
                hasPlan: true
                isVerified: true
                pendingEmail: null
    UserOk:
      description: Updated user.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
    PlanCreated:
      description: Plan created (`PLANNING`).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - properties:
                  data:
                    $ref: '#/components/schemas/PlanDto'
    GuestOk:
      description: The guest.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - properties:
                  data:
                    $ref: '#/components/schemas/GuestDto'
    QuoteOk:
      description: The quote request.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - properties:
                  data:
                    $ref: '#/components/schemas/QuoteRequestDto'
    QuotePageOk:
      description: One page of quote requests.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - properties:
                  data:
                    $ref: '#/components/schemas/QuoteRequestDtoPage'
    ProjectOk:
      description: The vendor project.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - properties:
                  data:
                    $ref: '#/components/schemas/VendorProjectDto'
    ProjectPageOk:
      description: One page of vendor projects.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - properties:
                  data:
                    $ref: '#/components/schemas/VendorProjectDtoPage'
    VendorServiceOk:
      description: The vendor's package.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - properties:
                  data:
                    $ref: '#/components/schemas/VendorServiceDto'

  schemas:
    # ------------------------------------------------------------ envelope
    ApiSuccess:
      type: object
      description: Success envelope (`ApiResponse` with `success = true`). `data` is omitted when null.
      required: [success, code, message]
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          const: SUCCESS
        message:
          type: string
          description: Vietnamese user-facing message.
          examples: [Thao tác thành công]
        data:
          description: Operation payload.
    ApiError:
      type: object
      description: Error envelope (`ApiResponse` with `success = false`). `errors` only on field/parameter validation failures; `data` only on some 409s (e.g. `QUOTE_ALREADY_OPEN`).
      required: [success, code, message]
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
          description: Error code from spec §1.3.
          examples: [BAD_REQUEST]
        message:
          type: string
          description: Vietnamese user-facing message.
        data:
          description: Extra payload pointing at an existing record.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Request field (or parameter) name.
        message:
          type: string
    PageResponse:
      type: object
      description: Page shape of list endpoints (`PageResponse`).
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # ------------------------------------------------------------ shared types
    Money:
      type: integer
      format: int64
      description: Amount in VND (integer, no decimals).
      examples: [25000000]

    # ------------------------------------------------------------ enums
    QuoteRequestStatus:
      type: string
      enum: [PENDING, QUOTED, ACCEPTED, DECLINED, CANCELLED]
      description: §1.6. `ACCEPTED`, `DECLINED`, `CANCELLED` are final.
    VendorProjectStatus:
      type: string
      enum: [UPCOMING, IN_PROGRESS, COMPLETED, CANCELLED]
      description: §1.6. `COMPLETED`, `CANCELLED` are final.
    BudgetStatus:
      type: string
      enum: [PLANNED, DEPOSITED, PAID_FULL]
    WeddingStyle:
      type: string
      enum: [MODERN, CLASSIC, MINIMAL, ELEGANT]

    # ------------------------------------------------------------ auth / user
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 6
    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          minLength: 1
          description: Google ID token obtained by the app.
    SendOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 1
    VerifyOtpRequest:
      type: object
      required: [email, otpCode]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: The address the code was sent to (account e-mail or pending new e-mail).
        otpCode:
          type: string
          pattern: '^[0-9]{4}$'
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
          description: JWT, 2 hours.
        refreshToken:
          type: string
          description: JWT, 30 days. No endpoint accepts it yet.
        user:
          $ref: '#/components/schemas/UserDto'
    UserDto:
      type: object
      description: The spec's `user` object.
      required: [id, email, fullName, phone, avatarUrl, role, hasPlan, isVerified, pendingEmail]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
        role:
          type: [string, 'null']
          enum: [ROLE_COUPLE, ROLE_VENDOR, null]
          description: null until chosen with `PUT /users/role`.
        hasPlan:
          type: boolean
          description: true when the user owns or joined a `PLANNING` plan (a `DRAFT` does not count).
        isVerified:
          type: boolean
        pendingEmail:
          type: [string, 'null']
          format: email
          description: New e-mail waiting for its OTP.
    RoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [ROLE_COUPLE, ROLE_VENDOR]
    ProfileRequest:
      type: object
      required: [fullName, email]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        phone:
          type: [string, 'null']
          pattern: '^$|^(03|05|07|08|09)\d{8}$'
          description: Empty or a Vietnamese mobile number (§1.1); empty clears it.

    # ------------------------------------------------------------ plan
    CategoryRequest:
      type: object
      required: [name, allocatedAmount]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        allocatedAmount:
          $ref: '#/components/schemas/Money'
          minimum: 0
    CreatePlanRequest:
      type: object
      required: [weddingDate, totalBudget, categories]
      properties:
        weddingDate:
          type: string
          format: date
          description: At least today + 7 days.
        engagementDate:
          type: [string, 'null']
          format: date
        totalBudget:
          type: integer
          format: int64
          minimum: 10000000
        categories:
          type: array
          minItems: 1
          maxItems: 30
          description: Σ `allocatedAmount` ≤ 150 % of `totalBudget`.
          items:
            $ref: '#/components/schemas/CategoryRequest'
    AiGenerateRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        totalBudget:
          type: [integer, 'null']
          format: int64
          minimum: 10000000
        weddingDate:
          type: [string, 'null']
          format: date
          description: At least today + 7 days; default today + 6 months.
        guestCount:
          type: [integer, 'null']
          exclusiveMinimum: 0
          maximum: 5000
        style:
          oneOf:
            - $ref: '#/components/schemas/WeddingStyle'
            - type: 'null'
    TaskUpdateRequest:
      type: object
      required: [isCompleted]
      properties:
        isCompleted:
          type: boolean
    JoinSyncRequest:
      type: object
      required: [syncCode]
      properties:
        syncCode:
          type: string
          pattern: '^[A-Za-z0-9]{6}$'
          description: Case-insensitive.
    PlanDto:
      type: object
      required: [planId, weddingDate, engagementDate, daysRemaining, totalBudget, totalSpent, spentPercentage, tasksProgress, partner, budgetItems, tasks]
      properties:
        planId:
          type: string
          format: uuid
        weddingDate:
          type: string
          format: date
        engagementDate:
          type: [string, 'null']
          format: date
        daysRemaining:
          type: integer
          format: int64
          minimum: 0
        totalBudget:
          $ref: '#/components/schemas/Money'
        totalSpent:
          $ref: '#/components/schemas/Money'
        spentPercentage:
          type: number
          description: 1 decimal, HALF_UP.
        tasksProgress:
          $ref: '#/components/schemas/TasksProgress'
        partner:
          oneOf:
            - $ref: '#/components/schemas/PartnerDto'
            - type: 'null'
        budgetItems:
          type: array
          items:
            $ref: '#/components/schemas/BudgetItemDto'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskDto'
    TasksProgress:
      type: object
      required: [totalTasks, completedTasks, progressPercentage]
      properties:
        totalTasks:
          type: integer
        completedTasks:
          type: integer
        progressPercentage:
          type: number
          description: 1 decimal, HALF_UP; 0 without tasks.
    PartnerDto:
      type: object
      required: [id, name, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatarUrl:
          type: [string, 'null']
    BudgetItemDto:
      type: object
      required: [id, categoryName, estimatedAmount, actualAmount, status, notes]
      properties:
        id:
          type: string
          format: uuid
        categoryName:
          type: string
        estimatedAmount:
          $ref: '#/components/schemas/Money'
        actualAmount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/BudgetStatus'
        notes:
          type: [string, 'null']
    TaskDto:
      type: object
      required: [id, title, dueDate, monthGroup, isCompleted]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        dueDate:
          type: string
          format: date
        monthGroup:
          type: string
          examples: [Trước 6 tháng]
        isCompleted:
          type: boolean
    SyncCodeDto:
      type: object
      required: [syncCode, expiresAt]
      properties:
        syncCode:
          type: string
          pattern: '^[A-HJ-NP-Z2-9]{6}$'
        expiresAt:
          type: string
          format: date-time

    # ------------------------------------------------------------ guest
    GuestRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: [string, 'null']
          pattern: '^$|^(03|05|07|08|09)\d{8}$'
        group:
          type: [string, 'null']
          maxLength: 100
        status:
          type: [string, 'null']
          description: '`attending`, `pending` or `declined`, case-insensitive (Java `@Pattern("(?i)attending|pending|declined")`); null → `pending`.'
          examples: [pending]
        notes:
          type: [string, 'null']
          maxLength: 500
        tableNumber:
          type: [integer, 'null']
          exclusiveMinimum: 0
    GuestDto:
      type: object
      required: [id, name, phone, group, status, notes, tableNumber]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: [string, 'null']
        group:
          type: [string, 'null']
        status:
          type: string
          enum: [attending, pending, declined]
        notes:
          type: [string, 'null']
        tableNumber:
          type: [integer, 'null']
    GuestStats:
      type: object
      required: [total, attending, pending, declined]
      properties:
        total:
          type: integer
        attending:
          type: integer
        pending:
          type: integer
        declined:
          type: integer
    GuestListDto:
      type: object
      required: [stats, guests]
      properties:
        stats:
          $ref: '#/components/schemas/GuestStats'
        guests:
          type: array
          items:
            $ref: '#/components/schemas/GuestDto'

    # ------------------------------------------------------------ catalog
    ServiceDto:
      type: object
      required: [id, name, providerId, providerName, price, discountPrice, rating, reviewCount, address, category, thumbnailUrl, description, zaloUrl]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        providerId:
          type: [string, 'null']
          format: uuid
          description: User account id of the vendor; null for a studio package.
        providerName:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        discountPrice:
          type: [integer, 'null']
          format: int64
          description: Price after discount (VND), null when not discounted.
        rating:
          type: number
          description: 0 for a studio package.
        reviewCount:
          type: integer
        address:
          type: [string, 'null']
        category:
          type: string
          enum: [photo, decor, restaurant, dress]
        thumbnailUrl:
          type: [string, 'null']
        description:
          type: [string, 'null']
        zaloUrl:
          type: [string, 'null']
          description: '`https://zalo.me/{phone}`; null when the provider has no number.'
          examples: ['https://zalo.me/0900000004']
    ServiceDtoPage:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ServiceDto'

    # ------------------------------------------------------------ notification
    NotificationDto:
      type: object
      required: [id, title, body, kind, isRead, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        kind:
          type: string
          enum: [ai, message, sync, reminder]
          description: Icon hint; missing kind is reported as `reminder`.
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NotificationDtoPage:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NotificationDto'

    # ------------------------------------------------------------ message
    SendMessageRequest:
      type: object
      required: [recipientId, content]
      properties:
        recipientId:
          type: string
          format: uuid
          description: User account id of the counterpart (e.g. `providerId` from the catalog).
        content:
          type: string
          minLength: 1
          maxLength: 2000
        attachmentUrl:
          type: [string, 'null']
          maxLength: 500
    MessageDto:
      type: object
      required: [id, roomId, senderId, recipientId, content, attachmentUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        content:
          type: string
        attachmentUrl:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    # ------------------------------------------------------------ quote
    SendQuoteRequest:
      type: object
      required: [servicePackageId]
      properties:
        servicePackageId:
          type: string
          format: uuid
        eventDate:
          type: [string, 'null']
          format: date
          description: Not before today.
        venue:
          type: [string, 'null']
          maxLength: 255
        guestCount:
          type: [integer, 'null']
          minimum: 1
          maximum: 5000
        message:
          type: [string, 'null']
          maxLength: 1000
    QuoteReply:
      type: object
      required: [quotedPrice]
      properties:
        quotedPrice:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: VND.
        vendorNote:
          type: [string, 'null']
          maxLength: 1000
    DeclineRequest:
      type: object
      properties:
        vendorNote:
          type: [string, 'null']
          maxLength: 1000
    AcceptRequest:
      type: object
      description: Needed only when the request has no event date.
      properties:
        eventDate:
          type: [string, 'null']
          format: date
          description: Required (not before today) when the request has no event date; ignored otherwise.
        venue:
          type: [string, 'null']
          maxLength: 255
          description: When not blank, replaces the request's venue.
    QuoteRequestDto:
      type: object
      required: [id, coupleName, packageId, packageName, vendorName, eventDate, venue, guestCount, message, status, quotedPrice, vendorNote, createdAt, respondedAt]
      properties:
        id:
          type: string
          format: uuid
        coupleName:
          type: string
        packageId:
          type: string
          format: uuid
        packageName:
          type: string
          description: Snapshot taken when the request was sent.
        vendorName:
          type: string
        eventDate:
          type: [string, 'null']
          format: date
        venue:
          type: [string, 'null']
        guestCount:
          type: [integer, 'null']
        message:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/QuoteRequestStatus'
        quotedPrice:
          type: [integer, 'null']
          format: int64
          description: VND.
        vendorNote:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        respondedAt:
          type: [string, 'null']
          format: date-time
    QuoteRequestDtoPage:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/QuoteRequestDto'

    # ------------------------------------------------------------ project
    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/VendorProjectStatus'
    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    VendorProjectDto:
      type: object
      required: [id, coupleName, vendorName, packageName, eventDate, venue, agreedPrice, status, quoteRequestId, cancelRequestedAt, cancelReason]
      properties:
        id:
          type: string
          format: uuid
        coupleName:
          type: string
        vendorName:
          type: string
        packageName:
          type: string
        eventDate:
          type: string
          format: date
        venue:
          type: [string, 'null']
        agreedPrice:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/VendorProjectStatus'
        quoteRequestId:
          type: string
          format: uuid
        cancelRequestedAt:
          type: [string, 'null']
          format: date-time
          description: Set only while a cancellation request is pending.
        cancelReason:
          type: [string, 'null']
          description: Reason of the pending request; kept after the vendor approved it.
    VendorProjectDtoPage:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VendorProjectDto'

    # ------------------------------------------------------------ vendor
    DashboardDto:
      type: object
      required: [monthlyRevenue, newRequestCount, rating, quoteRequests, upcoming]
      properties:
        monthlyRevenue:
          $ref: '#/components/schemas/Money'
        newRequestCount:
          type: integer
          format: int64
        rating:
          type: number
        quoteRequests:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/QuoteRequestDto'
        upcoming:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/VendorProjectDto'
    VendorServiceRequest:
      type: object
      required: [name, category, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: string
          description: '`photo`, `decor`, `restaurant` or `dress`, case-insensitive (Java `@Pattern("(?i)photo|decor|restaurant|dress")`).'
          examples: [decor]
        type:
          type: [string, 'null']
          maxLength: 50
          description: Blank → the lower-case category.
        price:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: VND.
        discountPrice:
          type: [integer, 'null']
          format: int64
          exclusiveMinimum: 0
          description: VND, lower than `price`; null = no discount.
        description:
          type: [string, 'null']
          maxLength: 2000
        features:
          type: [array, 'null']
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 200
        thumbnailUrl:
          type: [string, 'null']
          maxLength: 500
    ActiveRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
    VendorServiceDto:
      type: object
      required: [id, name, category, type, price, discountPrice, description, features, thumbnailUrl, isActive, projectCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
          enum: [photo, decor, restaurant, dress]
        type:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        discountPrice:
          type: [integer, 'null']
          format: int64
        description:
          type: [string, 'null']
        features:
          type: array
          items:
            type: string
        thumbnailUrl:
          type: [string, 'null']
        isActive:
          type: boolean
        projectCount:
          type: integer
          format: int64
          description: Projects of this package that are not `CANCELLED`.
