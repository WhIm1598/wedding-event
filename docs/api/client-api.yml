    patch:
      tags: [project]
      operationId: updateProjectStatus
      summary: Move a project along its lifecycle
      description: |
        Allowed (§1.6): `UPCOMING → IN_PROGRESS | COMPLETED | CANCELLED`, `IN_PROGRESS → COMPLETED | CANCELLED`;
        anything else (including the current status, or any move from `COMPLETED`/`CANCELLED`) →
        `409 INVALID_STATUS_TRANSITION`. Moving to `IN_PROGRESS`/`COMPLETED` while the couple asked to cancel rejects
        that request (the couple is notified). The couple is also notified on `COMPLETED` and `CANCELLED`. An unknown
        status value is an unparsable body → `400 BAD_REQUEST` without `errors[]`.
