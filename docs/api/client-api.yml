  /api/v1/client/quote-requests/{id}/accept:
    post:
      tags: [quote]
      operationId: acceptQuote
      summary: Accept the vendor's quote
      description: |
        Only a `QUOTED` request (`409 INVALID_STATUS_TRANSITION` otherwise). The body is optional; `eventDate` is
        required only when the request has none (`400` on `eventDate` when missing or before today) and is ignored
        otherwise; a non-blank `venue` replaces the request's venue. The request becomes `ACCEPTED` and exactly one
        `UPCOMING` vendor project is created at the quoted price; the vendor is notified ("Báo giá đã được chấp
        nhận"). Returns the project.
      x-spec-function: FN-VND-03
