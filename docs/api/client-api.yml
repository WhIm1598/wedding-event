  /api/v1/messages/send:
    post:
      tags: [message]
      operationId: sendMessage
      summary: Send a chat message (not used by the app)
      description: |
        **Not used by the app since v1.1.3** — couples contact the studio and vendors on Zalo (`zaloUrl`); the endpoint
        is kept to reopen chat later. Only couple ↔ vendor: the recipient must exist, be active and have the opposite
        role (so not the sender) — otherwise `400 INVALID_RECIPIENT`. One room per pair of users. After commit the
        message is broadcast to `/topic/messages/{roomId}`; a recipient without an open STOMP session gets an inbox
        notification `kind = message` (title = sender's name) + push. Same operation over STOMP: `SEND /app/chat`.
      x-spec-function: FN-MSG-01
      x-roles: [ROLE_COUPLE, ROLE_VENDOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              recipientId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
              content: Chào Lumiere Studio, gói Pre-wedding Đà Lạt còn lịch vào cuối tuần tháng 11 không ạ?
              attachmentUrl: null
      responses:
        '201':
          description: Message stored.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MessageDto'
        '400':
          description: '`BAD_REQUEST` (field errors) or `INVALID_RECIPIENT`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validation:
                  value:
                    success: false
                    code: BAD_REQUEST
                    message: Dữ liệu không hợp lệ
                    errors:
                      - { field: content, message: Nội dung tin nhắn không được để trống }
                invalidRecipient:
                  value:
                    success: false
                    code: INVALID_RECIPIENT
                    message: Không thể gửi tin nhắn tới người nhận này
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

