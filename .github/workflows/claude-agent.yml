name: Claude Spec-to-Code Agent

# Code is generated ONLY from changes to the specs in docs/features/. A run without spec changes
# (pushes elsewhere don't even start it; a manual run with no diff) stops before calling Claude.
on:
  push:
    branches: [main]
    paths:
      - 'docs/features/**.md'
  workflow_dispatch:
    inputs:
      base:
        description: 'Compare the specs against this commit/tag (default: previous commit). Only spec changes since then are implemented.'
        required: false
      spec:
        description: 'Spec file to implement (default: docs/features/detailed_functional_specification.md)'
        required: false
      targets:
        description: 'Comma-separated targets: web,mobile,backend (default: every initialized module)'
        required: false

# One agent run at a time; queued runs build on the latest main
concurrency:
  group: claude-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # create/update the PR labels

jobs:
  generate:
    runs-on: ubuntu-latest
    # Large spec changes can keep Claude Code busy for a long time; the build check still has to fit after it
    timeout-minutes: 120
    steps:
      # GitHub passes an empty string when the secret doesn't exist (or for runs from forks).
      # Spec pushes then skip generation with a warning instead of failing; a manual run fails loudly.
      - name: Check Claude Code token
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="Repository secret CLAUDE_CODE_OAUTH_TOKEN is not set (run 'claude setup-token', then Settings → Secrets and variables → Actions → New repository secret)."
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg Skipping code generation."
          echo "present=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff the spec against the previous commit

      - name: Set up Python
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Inputs are passed via env (not interpolated into the script) to avoid shell injection
      - name: Prepare task prompt
        if: steps.key.outputs.present == 'true'
        id: prepare
        env:
          ALLOW_DEPENDENCY_CHANGES: ${{ vars.ALLOW_DEPENDENCY_CHANGES || 'false' }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_INPUT: ${{ inputs.base }}
          SPEC_INPUT: ${{ inputs.spec }}
          TARGETS_INPUT: ${{ inputs.targets }}
        run: |
          # Sets the step output has_changes=true|false
          args=(--out "$RUNNER_TEMP/claude-task.md")
          [ -n "$BASE_INPUT" ] && args+=(--base "$BASE_INPUT")
          [ -n "$SPEC_INPUT" ] && args+=(--spec "$SPEC_INPUT")
          [ -n "$TARGETS_INPUT" ] && args+=(--targets "$TARGETS_INPUT")
          python .github/scripts/claude_coder.py prepare "${args[@]}"

      - name: Set up Node.js
        if: steps.prepare.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Claude Code CLI is called directly: anthropics/claude-code-action does not support `push` events.
      # Claude may only read the repo, edit files and run read-only git; committing, branching and the PR are
      # done by the steps below, after the guard and the build check.
      - name: Implement spec with Claude Code
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_MAX_TURNS: ${{ vars.CLAUDE_MAX_TURNS || '150' }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          # stream-json: progress shows in the log; the guard step reads the final "result" event for the PR summary
          claude -p "$(cat "$RUNNER_TEMP/claude-task.md")" \
            --model "$CLAUDE_MODEL" \
            --max-turns "$CLAUDE_MAX_TURNS" \
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,TodoWrite,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)" \
            --output-format stream-json --verbose \
            | tee "$RUNNER_TEMP/claude-execution.jsonl"

      # Reverts anything outside the safety rails and writes the PR description
      - name: Guard changes
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          ALLOW_DEPENDENCY_CHANGES: ${{ vars.ALLOW_DEPENDENCY_CHANGES || 'false' }}
          SPEC_INPUT: ${{ inputs.spec }}
          TARGETS_INPUT: ${{ inputs.targets }}
        run: |
          args=(--report "$RUNNER_TEMP/ai-report.md" --execution-file "$RUNNER_TEMP/claude-execution.jsonl")
          [ -n "$SPEC_INPUT" ] && args+=(--spec "$SPEC_INPUT")
          [ -n "$TARGETS_INPUT" ] && args+=(--targets "$TARGETS_INPUT")
          python .github/scripts/claude_coder.py guard "${args[@]}"

      - name: Detect changes
        if: steps.prepare.outputs.has_changes == 'true'
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Agent produced no changes."
          fi

      # Second opinion: the code-reviewer agent (.claude/agents/code-reviewer.md) reviews the guarded changes read-only.
      # Disable with the repository variable CLAUDE_REVIEW=false. A reviewer that fails or times out gives verdict UNKNOWN.
      - name: Review generated code
        if: steps.changes.outputs.changed == 'true' && vars.CLAUDE_REVIEW != 'false'
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_MAX_TURNS: ${{ vars.CLAUDE_REVIEW_MAX_TURNS || '60' }}
        run: |
          python .github/scripts/claude_coder.py review-prompt --task "$RUNNER_TEMP/claude-task.md" \
            --out "$RUNNER_TEMP/review-task.md" --system-out "$RUNNER_TEMP/reviewer-system.md"
          claude -p "$(cat "$RUNNER_TEMP/review-task.md")" \
            --append-system-prompt "$(cat "$RUNNER_TEMP/reviewer-system.md")" \
            --model "$CLAUDE_MODEL" \
            --max-turns "$CLAUDE_MAX_TURNS" \
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*)" \
            --output-format stream-json --verbose \
            | tee "$RUNNER_TEMP/review-execution.jsonl" \
            || echo "::warning::The code review did not complete; continuing with verdict UNKNOWN."
          # Sets step outputs verdict / blocking / critical / high
          python .github/scripts/claude_coder.py review-result \
            --execution-file "$RUNNER_TEMP/review-execution.jsonl" --out "$RUNNER_TEMP/review.md"

      # One automatic fix round for CRITICAL/HIGH findings (disable with CLAUDE_AUTO_FIX=false). Its edits go through
      # the same guard and build check below; the findings are not re-reviewed, the PR description says so.
      - name: Fix review findings
        if: fromJSON(steps.review.outputs.blocking || '0') > 0 && vars.CLAUDE_AUTO_FIX != 'false'
        id: fix
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_MAX_TURNS: ${{ vars.CLAUDE_MAX_TURNS || '150' }}
        run: |
          python .github/scripts/claude_coder.py fix-prompt --task "$RUNNER_TEMP/claude-task.md" \
            --review "$RUNNER_TEMP/review.md" --out "$RUNNER_TEMP/fix-task.md"
          claude -p "$(cat "$RUNNER_TEMP/fix-task.md")" \
            --model "$CLAUDE_MODEL" \
            --max-turns "$CLAUDE_MAX_TURNS" \
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,TodoWrite,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)" \
            --output-format stream-json --verbose \
            | tee "$RUNNER_TEMP/fix-execution.jsonl" \
            || echo "::warning::The fix pass did not complete; its partial edits are still guarded and build-checked."
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Guard changes after fix
        if: steps.fix.outputs.ran == 'true'
        env:
          ALLOW_DEPENDENCY_CHANGES: ${{ vars.ALLOW_DEPENDENCY_CHANGES || 'false' }}
          SPEC_INPUT: ${{ inputs.spec }}
          TARGETS_INPUT: ${{ inputs.targets }}
        run: |
          args=(--report "$RUNNER_TEMP/ai-report.md" --execution-file "$RUNNER_TEMP/claude-execution.jsonl")
          [ -n "$SPEC_INPUT" ] && args+=(--spec "$SPEC_INPUT")
          [ -n "$TARGETS_INPUT" ] && args+=(--targets "$TARGETS_INPUT")
          python .github/scripts/claude_coder.py guard "${args[@]}"

      - name: Add review to PR description
        if: steps.review.outputs.verdict != ''
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          FIX_RAN: ${{ steps.fix.outputs.ran }}
        run: |
          args=(--report "$RUNNER_TEMP/ai-report.md" --review "$RUNNER_TEMP/review.md" --verdict "$VERDICT")
          [ "$FIX_RAN" = "true" ] && args+=(--fix-execution-file "$RUNNER_TEMP/fix-execution.jsonl")
          python .github/scripts/claude_coder.py append-review "${args[@]}"

      - name: Snapshot generated changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add -A
          git diff --cached > "$RUNNER_TEMP/ai-generated.patch"
          git reset -q

      - name: Verify (build + test)
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/verify-monorepo

      # Keep the generated code reviewable even when verification fails
      - name: Upload generated patch
        if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-generated-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ai-generated.patch
            ${{ runner.temp }}/ai-report.md
            ${{ runner.temp }}/review.md

      # Idempotent: creates the labels on first use and keeps their colour/description in sync afterwards
      - name: Ensure PR labels exist
        if: success() && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ai-generated --force --color 7057ff \
            --description "Code generated by the Claude spec-to-code agent (draft, needs human review)"
          gh label create ai-review-findings --force --color d93f0b \
            --description "AI code review found CRITICAL/HIGH issues or could not decide; check the review in the PR description"

      - name: Create draft Pull Request
        if: success() && steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/spec-update-${{ github.run_id }}
          delete-branch: true
          draft: true
          # ai-review-findings: the reviewer blocked (CRITICAL/HIGH found, possibly auto-fixed) or couldn't decide
          labels: |
            ai-generated
            ${{ (steps.review.outputs.verdict == 'BLOCK' || steps.review.outputs.verdict == 'UNKNOWN') && 'ai-review-findings' || '' }}
          # Only module source is committed; build outputs are ignored by each module's .gitignore
          add-paths: |
            admin-console/**
            client-console/**
            backend-common/**
          commit-message: 'feat(ai): implement spec changes from ${{ github.sha }}'
          title: '🤖 [AI Agent] Implement spec update (${{ github.sha }})'
          body-path: ${{ runner.temp }}/ai-report.md
