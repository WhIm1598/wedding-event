# Local development: docker compose -f docker-compose.dev.yml up -d  (PostgreSQL on :5432, shared with the admin backend)
spring:
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:dev_password}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  otp:
    log-code: true
  demo-data:
    enabled: true
