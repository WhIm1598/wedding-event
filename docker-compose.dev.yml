# Local development dependencies only (the apps run from your IDE / CLI).
#   docker compose -f docker-compose.dev.yml up -d
# Matches admin-console/backend/src/main/resources/application-dev.yml defaults.
services:
  postgres:
    image: postgres:16-alpine
    container_name: wedding_postgres_dev
    environment:
      POSTGRES_DB: wedding_db
      POSTGRES_USER: wedding_admin
      POSTGRES_PASSWORD: dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding_admin -d wedding_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
