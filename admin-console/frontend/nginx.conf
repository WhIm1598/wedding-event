server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tokens live in localStorage, so block framing and script injection (#47). Inline styles: React style props.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback for client-side routes (/dashboard, /bookings, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # add_header in a location drops the server-level ones, so repeat them here
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
