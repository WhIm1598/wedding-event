server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  # Trust X-Forwarded-Proto/Host from the nginx gateway: without it the browser's https Origin looks cross-origin → 403 (#37)
  forward-headers-strategy: framework

spring:
  application:
    name: admin-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wedding_db}
    username: ${SPRING_DATASOURCE_USERNAME:wedding_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # No hibernate.jdbc.time_zone: it shifted TIME columns (LocalTime) by the zone's 1970 offset (#33).
    # Instants still go to TIMESTAMPTZ as absolute UTC values; TIME/DATE columns keep the business time as entered.
  # Flyway owns the schema; migrations ship in backend-common (shared with client-console/backend).
  # Every service applies the same set on startup — Flyway's lock on flyway_schema_history serializes them.
  flyway:
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    baseline-on-migrate: false
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  zone: Asia/Ho_Chi_Minh
  jwt:
    # Must be >= 32 bytes. Required in every non-dev environment (env JWT_SECRET).
    secret: ${JWT_SECRET:}
    issuer: wedding-event-admin
    access-token-ttl: 2h
    refresh-token-ttl: 30d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  demo-data:
    enabled: false
  # Origin of the customer's public contract page (link in the Zalo message), e.g. https://admin.example.vn
  public-base-url: ${PUBLIC_BASE_URL:}
  zalo:
    oauth-url: https://oauth.zaloapp.com/v4/oa/access_token
    zns-url: https://business.openapi.zalo.me/message/template
  # Platform admin of an empty production database (#36, ADR-0001); ignored once one exists unless reset-password
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    # true: overwrite that platform admin's forgotten password on startup (then remove it)
    reset-password: ${ADMIN_RESET_PASSWORD:false}
