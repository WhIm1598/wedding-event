server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: admin-backend
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wedding_db}
    username: ${SPRING_DATASOURCE_USERNAME:wedding_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  # Flyway owns the schema; migrations ship in backend-common (shared with client-console/backend).
  # Every service applies the same set on startup — Flyway's lock on flyway_schema_history serializes them.
  flyway:
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    baseline-on-migrate: false
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  zone: Asia/Ho_Chi_Minh
  jwt:
    # Must be >= 32 bytes. Required in every non-dev environment (env JWT_SECRET).
    secret: ${JWT_SECRET:}
    issuer: wedding-event-admin
    access-token-ttl: 2h
    refresh-token-ttl: 30d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Link sent to customers in the Zalo message (contract viewer, TODO)
  public-base-url: ${PUBLIC_BASE_URL:http://localhost}
  demo-data:
    enabled: false
