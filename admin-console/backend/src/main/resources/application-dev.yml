# Local development: docker compose -f docker-compose.dev.yml up -d  (PostgreSQL on :5432)
spring:
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:dev_password}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo-data:
    enabled: true
